<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Report — watchcafe.eu</title>
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/nav.js" defer></script>
<script src="/watchdata.js?v=5"></script>
<script src="sample.js?v=5"></script>
<style>
  :root{
    --page:#121215; --card:#1c1c21; --border:#33333c;
    --accent:#d96a41; --ink:#e9e7e2; --muted:#a09da6;
    --nav-bg:#17171b; --nav-border:#2a2a31; --nav-hover:#22222a; --accent-glow:rgba(217,106,65,.7);
    /* the report itself is always light: paper, ink, a print-safe accent */
    --paper:#ffffff; --p-ink:#1d1d22; --p-muted:#6b6872; --p-line:#dcdae0; --p-soft:#f4f3f6; --p-accent:#b8532e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding:28px 16px 60px}
  .wrap{max-width:948px;margin:0 auto}

  /* header and settings: the full page column, like the other pages; the paper below stays A4 wide */
  .top{max-width:948px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .top h1{color:var(--accent);font-size:clamp(20px,3vw,30px);font-weight:800;margin:0 0 4px}
  .top .sub{color:var(--muted);font-size:14px;margin:0}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .acts a,.acts button{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;padding:9px 14px;border:1px solid var(--border);background:#26262c;color:var(--ink);text-decoration:none}
  .acts a:hover,.acts button:hover{background:#30303a}
  .acts .primary{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);font-weight:600}
  .acts .primary:hover{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
  .panel{max-width:948px;margin:0 auto 10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px}
  .prow{display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap}
  .plbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);min-width:132px;padding-top:2px}
  .opts{display:flex;flex-wrap:wrap;gap:6px 18px;flex:1;min-width:0}
  .opts label{font-size:14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
  .opts .subgrp{display:inline-flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding-left:12px;border-left:1px solid var(--border)}
  .opts .subgrp label{color:var(--muted);font-size:13px}
  .opts label.dis{opacity:.45;cursor:default}
  .opts .nofill{font-size:12px;color:#ffb02e;margin-left:2px}
  .opts .nofill::before{content:"· "}
  .psep{border-top:1px dashed var(--border);margin:12px 0}
  .hint{max-width:948px;margin:0 auto 22px;font-size:12.5px;color:var(--muted);text-align:right}
  .papercap{max-width:210mm;margin:0 auto 6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6d6a73;text-align:center}
  @media(max-width:620px){.plbl{min-width:0;flex-basis:100%}.opts .subgrp{border-left:none;padding-left:0}.hint{text-align:left}}

  /* watch picker inside the panel: sources (Viewer) and watches */
  .pick .cnt{font-size:13px;color:var(--muted)}
  .pick .lnks{margin-left:auto;font-size:13px;color:var(--muted)}
  .pick .grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 0}
  .pick .src{font-size:12px;color:var(--muted);min-width:132px}
  .pick .src b{color:var(--ink);font-weight:600}
  .pick .glnk{margin-left:auto;font-size:12px;color:var(--muted)}
  .pick .lnk{font:inherit;font-size:13px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
  .pick .glnk .lnk{font-size:12px}
  .pick .lnk:hover{text-decoration:underline}
  .pick .sep{color:var(--muted);font-size:13px;margin:0 2px}
  .pick .chip{font:inherit;font-size:13px;cursor:pointer;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;
    background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
  .pick .chip .ck{font-size:11px;width:10px}
  .pick .chip.off{background:transparent;border:1px dashed color-mix(in srgb,var(--muted) 50%,transparent);color:var(--muted)}
  .pick .chip.off .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
  .pick .chip .em{font-size:11px;opacity:.75}
  .pick .foot{font-size:12px;color:var(--muted);margin:10px 0 0;padding:0;border:0;display:block}
  .pick-none{max-width:210mm;margin:0 auto;padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px;font-size:14px}
  @media (max-width:600px){ .pick .src{flex-basis:100%} }

  /* paper */
  .sheet{background:var(--paper);color:var(--p-ink);max-width:210mm;margin:0 auto 24px;padding:16mm 15mm;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.45);font-size:10.5pt;line-height:1.4}
  .sheet h2{font-size:20pt;font-weight:800;color:var(--p-accent);margin:0 0 2px;letter-spacing:-.01em}
  .sheet h3{font-size:10pt;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--p-muted);margin:16px 0 6px;break-after:avoid}
  .sheet .meta{color:var(--p-muted);font-size:9.5pt;margin:0 0 12px}
  .sheet table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:0 0 4px}
  .sheet th{text-align:left;font-weight:600;color:var(--p-muted);font-size:8pt;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--p-ink);padding:4px 5px;vertical-align:bottom;line-height:1.25}
  .sheet th small{display:block;text-transform:none;letter-spacing:0;font-weight:400}
  .sheet td{border-bottom:1px solid var(--p-line);padding:3.5px 6px;vertical-align:top}
  .sheet tr{break-inside:avoid}
  .sheet thead{display:table-header-group}
  .sheet .num{text-align:right;font-variant-numeric:tabular-nums}
  .sheet td.num{white-space:nowrap}
  .ovt td:first-child{min-width:44mm} /* the overview keeps a watch name on one line where it can */
  .sheet .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:9pt}
  .sheet .dim{color:var(--p-muted)}
  .sheet .nw{white-space:nowrap}
  .sheet .ns td{border-top:1.5px dashed var(--p-accent)}
  .tag{display:inline-block;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--p-accent);border:1px solid var(--p-accent);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
  .tgmark{display:inline-block;width:8px;height:8px;box-sizing:border-box;border:1.5px solid;transform:rotate(45deg);margin:0 6px 0 2px;vertical-align:0}

  .cover-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--p-accent);padding-bottom:10px;margin-bottom:14px}
  .brand{font-size:9pt;color:var(--p-muted);text-align:right;line-height:1.5}
  .brand b{color:var(--p-ink)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
  .kpi{background:var(--p-soft);border-radius:6px;padding:8px 10px}
  .kpi .l{font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:var(--p-muted)}
  .kpi .v{font-size:15pt;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
  .kpi .v small{font-size:9pt;font-weight:400;color:var(--p-muted)}
  .kpi.main .v{color:var(--p-accent)}

  .watch{break-before:page}
  .watch-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--p-accent);padding-bottom:6px;margin-bottom:6px}
  .watch-head h2{font-size:17pt}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .chart{border:1px solid var(--p-line);border-radius:6px;padding:6px 6px 2px;break-inside:avoid}
  .chart .ct{font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:var(--p-muted);margin:0 0 2px 2px}
  .chart svg{display:block;width:100%;height:auto}
  .legend{font-size:8.5pt;color:var(--p-muted);margin:4px 0 0}
  .legend span{margin-right:10px;white-space:nowrap}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ident{color:var(--p-muted);font-size:9.5pt;margin:-2px 0 8px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin:0 0 4px}
  .kv table{margin:0}
  .kv td.k{color:var(--p-muted);width:42%}
  .detbox{border-top:1.5px solid var(--p-ink);break-inside:avoid}
  .wornrow{display:flex;gap:16px;align-items:flex-start;padding:7px 6px 6px;border-bottom:1px solid var(--p-line)}
  .wtxt{flex:1 1 auto;font-size:9.5pt;line-height:1.45;min-width:0}
  .wtxt .wl{display:block;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em;color:var(--p-muted);margin-bottom:1px}
  .heat{display:block;flex:none;max-width:62%;height:auto}
  .foot{margin-top:18px;padding-top:6px;border-top:1px solid var(--p-line);font-size:8pt;color:var(--p-muted);display:flex;justify-content:space-between}
  .empty{color:var(--p-muted);font-style:italic}

  /* screen only: the printable width (~184 mm) is also under 720px */
  /* a table that still doesn't fit a narrow screen scrolls inside the sheet */
  @media screen{.sheet{overflow-x:auto}}
  @media screen and (max-width:720px){
    .sheet{padding:18px 14px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .charts,.two,.kv{grid-template-columns:1fr}
    .wornrow{flex-direction:column}.heat{max-width:100%}
    .sheet table{font-size:9pt}
  }

  /* no fixed paper size: the print dialog uses the reader's default (A4, or Letter in the US/Canada) */
  @page{margin:14mm 13mm}
  @media print{
    body{background:#fff;padding:0;min-height:0}
    body > *:not(#report){display:none !important}
    .top,.panel,.hint,.papercap{display:none !important}
    .sheet{box-shadow:none;border-radius:0;margin:0;padding:0;max-width:none}
    .sheet + .sheet{break-before:page}
    .kpi,.chart{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .dot,.tag,.heat{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div id="report">
  <div class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="acts">
      <a href="/collection/" id="t-back"></a>
      <button class="primary" id="printBtn"></button>
    </div>
  </div>
  <div class="panel">
    <div class="prow">
      <span class="plbl" id="t-include"></span>
      <div class="opts">
        <label><input type="checkbox" id="optRaw" checked> <span id="t-raw"></span></label>
        <label><input type="checkbox" id="optLog" checked> <span id="t-optLog"></span></label>
        <span class="subgrp">
          <label id="lblPrice"><input type="checkbox" id="optPrice"> <span id="t-optPrice"></span><span class="nofill" id="noPrice" hidden></span></label>
          <label id="lblSerial"><input type="checkbox" id="optSerial"> <span id="t-optSerial"></span><span class="nofill" id="noSerial" hidden></span></label>
        </span>
      </div>
    </div>
    <div class="psep"></div>
    <div class="pick" id="pick"></div>
  </div>
  <p class="hint" id="t-note"></p>
  <p class="papercap" id="t-papercap"></p>
  <div id="sheets"></div>
</div>

var POS={
  dial_up:{en:"Dial up",nl:"Wijzerplaat boven",abbr:"DU",color:"#e0921f"},
  dial_down:{en:"Dial down",nl:"Wijzerplaat onder",abbr:"DD",color:"#b5651d"},
  crown_up:{en:"Crown up",nl:"Kroon boven",abbr:"CU",color:"#1f9e8f"},
  crown_down:{en:"Crown down",nl:"Kroon onder",abbr:"CD",color:"#3b74b8"},

  crown_right:{en:"Crown right",nl:"Kroon rechts",abbr:"CR",color:"#c94a72"},
  worn:{en:"Worn",nl:"Gedragen",abbr:"WR",color:"#3f9a3f"}
};
var DAY=86400000,MIN_RATE_GAP=6*3600000;
var lang=(function(){try{return localStorage.getItem("siouxWatchRateMeterLang")||"en";}catch(e){return "en";}})();
function t(k){return I18N[lang][k];}
function pos(code){var p=POS[code];return p?{label:p[lang],abbr:p.abbr,color:p.color}:{label:code?String(code).replace(/_/g," "):t("none"),abbr:code?String(code).slice(0,2).toUpperCase():"—",color:"#8a8a8a"};}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function loc(){return lang==="nl"?"nl-NL":"en-GB";}
function fDate(ms){return new Date(ms).toLocaleDateString(loc(),{day:"numeric",month:"short",year:"numeric"});}
function fShort(ms){return new Date(ms).toLocaleDateString(loc(),{day:"numeric",month:"short"});}
function fDTs(ms){return new Date(ms).toLocaleString(loc(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
function fDT(ms){return new Date(ms).toLocaleString(loc(),{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function sgn(v,d){if(v==null||!isFinite(v))return t("none");var s=Math.abs(v).toFixed(d==null?1:d);return (v>0&&+s!==0?"+":v<0&&+s!==0?"−":"")+s;}
function fDur(ms){var h=ms/3600000;return h<48?Math.round(h)+" h":(ms/DAY).toFixed(1)+" "+t("days");}
function fHM(ms){var m=Math.round(ms/60000);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";}

/* ---------- data ---------- */
// ?src=viewer: report on the backups loaded in the Viewer (merged when &merge=1, as there),
// optionally plus this device's own Rate Meter data
var PARAMS=new URLSearchParams(location.search),FROM_VIEWER=PARAMS.get("src")==="viewer",MERGE=PARAMS.get("merge")==="1";
var PICK_KEY="siouxWatchReportPick";
function viewerFiles(){
  try{var arr=JSON.parse(localStorage.getItem("swcViewerFiles")||"[]");
    return arr.map(function(f){try{var d=JSON.parse(f.text);
      var ws=Array.isArray(d.watches)?d.watches:Array.isArray(d)?d:d.watch?[d.watch]:[];
      return {name:f.name,from:d.exportedFrom&&typeof d.exportedFrom.device==="string"?d.exportedFrom:null,watches:ws};}catch(e){return null;}})
      .filter(function(f){return f&&f.watches.length;});}catch(e){return [];}
}
function localWatches(){
  try{var raw=localStorage.getItem("siouxWatchRateMeter");if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.watches))return s.watches;}}catch(e){}

function mergeKey(w){return (w.id!=null?"id:"+w.id:"name:"+(w.name||"")).toLowerCase();}

    var k=mergeKey(w);
    if(!by[k]){by[k]={name:w.name,info:w.info,edited:+w.edited||0,m:{_seen:{},list:[]},g:{_seen:{},list:[]},p:{_seen:{},list:[]},l:{_seen:{},list:[]},n:{_seen:{},list:[]}};order.push(k);}

      if(i<0)a.l.list.push(e);else if((+e.edited||0)>(+a.l.list[i].edited||0))a.l.list[i]=e;});

  });});
  return order.map(function(k){var a=by[k];return {_key:k,name:a.name,info:a.info,measurements:a.m.list,timegrapher:a.g.list,powerReserve:a.p.list,log:a.l.list,worn:a.n.list};});

// SRC.viewer: the report covers backups (and optionally this device); otherwise only this device (or the samples)

var SRC=loadSources(),pick={},srcPick={};

  if(MERGE){

function isOn(it,g){return it.key in pick?pick[it.key]:!isEmptyWatch(it.w)&&!(g.src&&g.src.dev);}
function linreg(pts){
  var n=pts.length;if(n<2)return null;var x0=pts[0].t,sx=0,sy=0,sxx=0,sxy=0,syy=0;

function analyse(w){
  var ms=(w.measurements||[]).filter(function(m){return isFinite(m.t)&&isFinite(m.offset);}).slice().sort(function(a,b){return a.t-b.t;});

  if(cur.length)sessions.push(cur);

  var last=sess[sess.length-1];
  var groups={},order=[];
  (last?last.pts:[]).forEach(function(m){var k=m.position||"";if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(m);});
  var positions=order.filter(function(k){return k;}).map(function(k){var f=linreg(groups[k]);return {code:k,n:groups[k].length,rate:f?f.rate:null};})
    .sort(function(a,b){return (b.rate==null?-1e9:b.rate)-(a.rate==null?-1e9:a.rate);});
  var rated=positions.filter(function(p){return p.rate!=null;}).map(function(p){return p.rate;});
  var tg=(w.timegrapher||[]).filter(function(s){return s.readings&&s.readings.length;}).slice().sort(function(a,b){return a.t-b.t;});
  tg.forEach(function(s){s.avg=s.readings.reduce(function(a,r){return a+(+r.rate);},0)/s.readings.length;});

    tg:tg,pr:pr,prAvg:prAvg,t0:ms.length?ms[0].t:null,t1:ms.length?ms[ms.length-1].t:null,

}

/* ---------- details, logbook and worn days (same rules as the Collection) ---------- */
// log and worn days use t = the day at 00:00 UTC
function fDay(ms){return new Date(ms).toLocaleDateString(loc(),{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});}
function fMonth(ms){return new Date(ms).toLocaleDateString(loc(),{month:"short",year:"numeric",timeZone:"UTC"});}
function infoOf(w){return w.info||{};}
function identLine(w,opt){
  var i=infoOf(w),parts=[[i.brand,i.model].filter(Boolean).join(" ")];

  if(i.year)parts.push(i.year);

function logOf(w){return (w.log||[]).slice().sort(function(a,b){return b.t-a.t;});}

// the 12 months up to today, or up to the sale for a sold or gifted watch (otherwise it would just run empty)

// one square per day for the 53 weeks up to the end, Monday on top, months underneath
function wornHeat(days,end){
  var dow=(new Date(end).getUTCDay()+6)%7,start=end-dow*DAY-52*7*DAY,c=5,g="",lastMon=-1,lastLbl=-9,gap=4;
  for(var col=0;col<53;col++){
    var c0=new Date(start+col*7*DAY),m=c0.getUTCMonth();

      var yr=m===0||lastLbl<0,lbl=c0.toLocaleDateString(loc(),{month:"short",timeZone:"UTC"})+(yr?" "+c0.getUTCFullYear():"");
      g+='<text x="'+col*c+'" y="'+(7*c+5.5)+'" font-size="4.6" fill="#6b6872">'+esc(lbl)+'</text>';lastLbl=col;

}

/* ---------- charts: sessions back to back, idle time removed ---------- */
var CW=340,CH=170,PAD={l:34,r:8,t:8,b:20},GAP=10;

function layout(a){
  var sess=a.sess.filter(function(s){return s.pts.length;});
  var total=sess.reduce(function(x,s){return x+Math.max(s.t1-s.t0,DAY/4);},0);
  var avail=CW-PAD.l-PAD.r-GAP*(sess.length-1),x=PAD.l;
  return sess.map(function(s){var span=Math.max(s.t1-s.t0,DAY/4),w=avail*span/total,x0=x;x+=w+GAP;
    return {s:s,x0:x0,x1:x0+w,X:function(tt){return x0+(tt-s.t0)/span*w;}};});
}
function yAxis(vals){
  var lo=Math.min.apply(null,vals.concat([0])),hi=Math.max.apply(null,vals.concat([0]));if(hi-lo<1){hi+=.5;lo-=.5;}
  var step=niceStep(hi-lo,4);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  var Y=function(v){return PAD.t+(hi-v)/(hi-lo)*(CH-PAD.t-PAD.b);},g="";
  for(var v=lo;v<=hi+1e-9;v+=step){var y=Y(v).toFixed(1);
    g+='<line x1="'+PAD.l+'" x2="'+(CW-PAD.r)+'" y1="'+y+'" y2="'+y+'" stroke="'+(Math.abs(v)<1e-9?"#9a97a0":"#e6e4ea")+'" stroke-width="'+(Math.abs(v)<1e-9?1:.8)+'"'+(Math.abs(v)<1e-9?' stroke-dasharray="3 3"':'')+'/>';
    g+='<text x="'+(PAD.l-4)+'" y="'+(+y+3)+'" text-anchor="end" font-size="8.5" fill="#6b6872">'+(v>0?"+":"")+(+v.toFixed(2))+'</text>';}
  return {Y:Y,g:g};
}
function frame(blocks){
  var g="";

    if(i>0){var xs=(b.x0-GAP/2).toFixed(1);g+='<line x1="'+xs+'" x2="'+xs+'" y1="'+PAD.t+'" y2="'+(CH-PAD.b)+'" stroke="#b8b5bd" stroke-dasharray="2 3"/>';}
    g+='<text x="'+b.x0.toFixed(1)+'" y="'+(CH-6)+'" font-size="8.5" fill="#6b6872">'+esc(fShort(b.s.t0))+'</text>';
    if(b.x1-b.x0>70)g+='<text x="'+b.x1.toFixed(1)+'" y="'+(CH-6)+'" font-size="8.5" fill="#6b6872" text-anchor="end">'+esc(fShort(b.s.t1))+'</text>';
  });

}

  var blocks=layout(a);if(!blocks.length)return "";

  blocks.forEach(function(b){
    var f=b.s.fit;
    if(f){var ya=f.icpt,yb=f.icpt+f.rate*(b.s.t1-f.x0)/DAY;
      g+='<line x1="'+b.X(b.s.t0).toFixed(1)+'" y1="'+ax.Y(ya).toFixed(1)+'" x2="'+b.X(b.s.t1).toFixed(1)+'" y2="'+ax.Y(yb).toFixed(1)+'" stroke="#b8532e" stroke-width="1.2" opacity=".75"/>';}
    b.s.pts.forEach(function(m){g+='<circle cx="'+b.X(m.t).toFixed(1)+'" cy="'+ax.Y(m.offset).toFixed(1)+'" r="2.4" fill="'+pos(m.position).color+'"/>';});
  });

function ratePoints(s){var out=[],lu=s[0];for(var i=1;i<s.length;i++){var dt=s[i].t-lu.t;if(dt>=MIN_RATE_GAP){out.push({t:s[i].t,v:(s[i].offset-lu.offset)/dt*DAY});lu=s[i];}}return out;}

  var blocks=layout(a);if(!blocks.length)return "";

  var tgIn=function(b){return a.tg.filter(function(s){return s.t>=b.s.t0&&s.t<=b.s.t1;});};
  var vals=[];segs.forEach(function(s){s.forEach(function(p){vals.push(p.v);});});

    pts.forEach(function(p){g+='<circle cx="'+b.X(p.t).toFixed(1)+'" cy="'+ax.Y(p.v).toFixed(1)+'" r="2.2" fill="#3f9a3f"/>';});
    tgIn(b).forEach(function(s){var cx=b.X(s.t),ya=ax.Y(s.avg).toFixed(1);

      s.readings.forEach(function(r){var cy=ax.Y(+r.rate);g+='<rect x="'+(cx-3.2).toFixed(1)+'" y="'+(cy-3.2).toFixed(1)+'" width="6.4" height="6.4" transform="rotate(45 '+cx.toFixed(1)+' '+cy.toFixed(1)+')" fill="#fff" stroke="'+pos(r.position).color+'" stroke-width="1.4"/>';});});
  });
  return '<svg viewBox="0 0 '+CW+' '+CH+'" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">'+g+'</svg>';

    +'<div class="brand"><b>watchcafe.eu</b>'+(info.sources?'':'<br>'+esc(t("device"))+': '+esc(info.device))+'</div></div>'
    +(info.sources&&info.sources.length?'<p class="meta">'+esc(t("sources"))+': '+info.sources.map(function(f){
      return f.dev?esc(t("thisDevice"))+' <span class="dim">('+esc(info.device)+')</span>':esc(f.name)+(f.from?' <span class="dim">('+esc(f.from.device)+(f.from.at?', '+esc(fDT(f.from.at)):'')+')</span>':'');}).join('; ')+'</p>':'')
    +'<div class="kpis">'+kpi(t("watches"),list.length)+kpi(t("measurements"),nMeas)
    +kpi(t("period"),all.length?esc(fShort(Math.min.apply(null,all)))+' – '+esc(fShort(Math.max.apply(null,all))):t("none"))
    +kpi(t("timegrapher"),list.reduce(function(x,a){return x+a.tg.length;},0))+'</div>'
    +'<h3>'+esc(t("overview"))+'</h3>'
    // short headings with the unit small underneath, so the watch name gets the room
    +'<table class="ovt"><thead><tr><th>'+t("watch")+'</th><th class="num">'+t("meas")+'</th><th class="num">'+t("sessShort")+'</th><th>'+t("period")+'</th><th class="num">'+t("rate")+'<small>'+t("perDay")+'</small></th><th class="num">'+t("tgShort")+'<small>'+t("perDay")+'</small></th><th class="num">'+t("pr")+'</th>'
    +(showWorn?'<th class="num">'+t("wornCol")+'<small>'+t("wornUnit")+'</small></th>':'')
    +(showPrice?'<th class="num">'+t("price")+'</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table>'
    +'</section>';
}

function watchPage(a,opt){
  var h='<section class="sheet watch">';
  h+='<div class="watch-head"><h2>'+esc(a.w.name)+(isFormer(a.w)?'<span class="tag">'+esc(t("soldTag"))+'</span>':'')+'</h2><span class="meta" style="margin:0;text-align:right">'+(a.t0!=null?esc(fDate(a.t0))+' – '+esc(fDate(a.t1)):'')+(a.w._source?'<br>'+esc(a.w._source):'')+'</span></div>';
  var idl=identLine(a.w,opt);if(idl)h+='<p class="ident">'+esc(idl)+'</p>';
  var lastTg=a.tg[a.tg.length-1];
  h+='<div class="kpis">'+kpi(t("current"),sgn(a.current,2),t("perDay"),true)
    +kpi(t("sessions"),a.sess.length)+kpi(t("measurements"),a.ms.length)
    +(a.prAvg!=null?kpi(t("powerReserve"),fHM(a.prAvg)):kpi(t("timegrapher"),lastTg?sgn(lastTg.avg):t("none"),lastTg?t("perDay"):""))+'</div>';

  if(a.ms.length>=2){
    var used={};a.ms.forEach(function(m){if(m.position)used[m.position]=1;});
    h+='<div class="charts"><div class="chart"><div class="ct">'+esc(t("offsetChart"))+'</div>'+offsetChart(a)+'</div>'
      +'<div class="chart"><div class="ct">'+esc(t("rateChart"))+'</div>'+rateChart(a)+'</div></div>';
    h+='<p class="legend">'+Object.keys(used).map(function(k){var p=pos(k);return '<span><span class="dot" style="background:'+p.color+'"></span>'+esc(p.label)+'</span>';}).join("")
      +(a.tg.length?'<span>'+esc(t("tgLegend"))+'</span>':'')+(a.sess.length>1?'<span>┆ '+esc(t("gapsRemoved"))+'</span>':'')+'</p>';
  } else h+='<p class="empty">'+esc(t("noData"))+'</p>';

  if(a.sess.length){
    h+='<h3>'+esc(t("sessions"))+'</h3><table><thead><tr><th>'+t("session")+'</th><th>'+t("from")+'</th><th>'+t("to")+'</th><th class="num">'+t("duration")+'</th><th class="num">'+t("n")+'</th><th class="num">'+t("rate")+' ('+t("perDay")+')</th><th class="num">'+t("r2")+'</th><th>'+t("note2")+'</th></tr></thead><tbody>'
      +a.sess.map(function(s,i){return '<tr><td>'+(i+1)+'</td><td class="nw">'+esc(fDTs(s.t0))+'</td><td class="nw">'+esc(fDTs(s.t1))+'</td><td class="num">'+fDur(s.t1-s.t0)+'</td><td class="num">'+s.pts.length+'</td><td class="num"><b>'+(s.fit?sgn(s.fit.rate,2):t("none"))+'</b></td><td class="num dim">'+(s.fit&&s.fit.r2!=null?s.fit.r2.toFixed(3):t("none"))+'</td><td class="dim">'+esc(s.pts[0].note||"")+'</td></tr>';}).join("")
      +'</tbody></table>';
  }

  var side=[];
  if(a.positions.length>1){
    side.push('<div><h3>'+esc(t("positions"))+' <span style="text-transform:none;letter-spacing:0;font-weight:400">('+esc(t("positionsSub"))+')</span></h3><table><thead><tr><th>'+t("position")+'</th><th class="num">'+t("n")+'</th><th class="num">'+t("perDay")+'</th></tr></thead><tbody>'
      +a.positions.map(function(p){var i=pos(p.code);return '<tr><td><span class="dot" style="background:'+i.color+'"></span>'+esc(i.label)+'</td><td class="num">'+p.n+'</td><td class="num">'+sgn(p.rate)+'</td></tr>';}).join("")
      +(a.spread!=null?'<tr><td colspan="2"><b>'+esc(t("spread"))+'</b></td><td class="num"><b>'+a.spread.toFixed(1)+'</b></td></tr>':'')+'</tbody></table></div>');
  }
  if(a.pr.length){
    side.push('<div><h3>'+esc(t("powerReserve"))+'</h3><table><thead><tr><th>'+t("wound")+'</th><th>'+t("stopped")+'</th><th class="num">'+t("reserve")+'</th></tr></thead><tbody>'
      +a.pr.map(function(p){return '<tr><td>'+esc(fDTs(p.start))+'</td><td>'+esc(fDTs(p.stop))+'</td><td class="num">'+fHM(p.reserveMs)+'</td></tr>';}).join("")
      +(a.pr.length>1?'<tr><td colspan="2"><b>'+esc(t("typical"))+'</b></td><td class="num"><b>'+fHM(a.prAvg)+'</b></td></tr>':'')+'</tbody></table></div>');
  }
  if(side.length)h+='<div class="two">'+side.join("")+'</div>';

  if(a.tg.length){
    h+='<h3>'+esc(t("timegrapher"))+'</h3><table><thead><tr><th>'+t("date")+'</th><th class="num">'+t("avg")+'</th><th>'+t("readings")+' ('+t("perDay")+')</th><th class="num">'+t("amp")+'</th><th class="num">'+t("beat")+'</th><th>'+t("note2")+'</th></tr></thead><tbody>'
      +a.tg.map(function(s){
        var amps=s.readings.map(function(r){return r.amplitude;}).filter(function(v){return v!=null&&isFinite(v);});
        var bes=s.readings.map(function(r){return r.beatError;}).filter(function(v){return v!=null&&isFinite(v);});
        return '<tr><td>'+esc(fDate(s.t))+'</td><td class="num"><b>'+sgn(s.avg)+'</b></td><td>'+tgReadings(s)+'</td>'
          +'<td class="num">'+(amps.length?Math.min.apply(null,amps)+'–'+Math.max.apply(null,amps)+'°':t("none"))+'</td>'
          +'<td class="num">'+(bes.length?Math.min.apply(null,bes).toFixed(1)+'–'+Math.max.apply(null,bes).toFixed(1)+' ms':t("none"))+'</td>'
          +'<td class="dim">'+esc(s.note||"")+'</td></tr>';}).join("")
      +'</tbody></table>';
  }

  if(opt.log)h+=detailsBlock(a.w,opt)+logbookBlock(a.w,opt);

  if(opt.raw&&a.ms.length){
    h+='<h3>'+esc(t("allMeas"))+' ('+a.ms.length+')</h3><table><thead><tr><th>'+t("time")+'</th><th class="num">'+t("offset")+' (s)</th><th>'+t("position")+'</th><th>'+t("note2")+'</th></tr></thead><tbody>'
      +a.ms.map(function(m,i){var p=pos(m.position);
        return '<tr'+(m.newStart&&i>0?' class="ns"':'')+'><td class="mono">'+esc(fDT(m.t))+(m.newStart?'<span class="tag">'+esc(t("newStart"))+'</span>':'')+'</td><td class="num mono">'+sgn(m.offset)+'</td><td>'+(m.position?'<span class="dot" style="background:'+p.color+'"></span>'+esc(p.label):t("none"))+'</td><td class="dim">'+esc(m.note||"")+'</td></tr>';}).join("")
      +'</tbody></table>';
  }
  h+='<div class="foot"><span>'+esc(t("footer"))+'</span><span>'+esc(fDT(Date.now()))+'</span></div>';
  return h+'</section>';
}

function renderPick(gs){
  var sel=0,tot=0,h="";
  gs.forEach(function(g){g.items.forEach(function(it){tot++;if(isOn(it,g))sel++;});});
  var allNone=function(gi){var x=gi==null?"":' data-g="'+gi+'"';return '<button class="lnk" data-all="1"'+x+'>'+esc(t("all"))+'</button><span class="sep">·</span><button class="lnk" data-all="0"'+x+'>'+esc(t("noneSel"))+'</button>';};
  var chip=function(on,label,attr,extra){return '<button class="chip'+(on?'':' off')+'" '+attr+' aria-pressed="'+on+'"><span class="ck">'+(on?'✓':'')+'</span><span class="nm">'+label+'</span>'+(extra||'')+'</button>';};
  var lbl=function(s){var l=srcLabel(s);return '<b>'+esc(l.b)+'</b>'+(l.d?' · '+esc(l.d):'');};
  if(SRC.viewer&&MERGE&&SRC.list.length>1){
    h+='<div class="prow"><span class="plbl">'+esc(t("sources"))+'</span><div class="grp" style="margin:0">'+SRC.list.map(function(s,i){return chip(srcOn(i),lbl(s),'data-src="'+i+'"');}).join("")+'</div></div><div class="psep"></div>';
  }
  h+='<div class="prow"><span class="plbl">'+esc(t("inReport"))+'</span><span class="cnt">'+sel+' '+esc(t("of"))+' '+tot+'</span><span class="lnks">'+allNone(null)+'</span></div>';
  gs.forEach(function(g,gi){
    h+='<div class="grp">'+(g.src&&gs.length>1?'<span class="src">'+lbl(g.src)+'</span>':'');
    h+=g.items.map(function(it,ii){return chip(isOn(it,g),esc(it.w.name||"?"),'data-g="'+gi+'" data-i="'+ii+'"',isEmptyWatch(it.w)?'<span class="em">'+esc(t("empty"))+'</span>':'');}).join("");
    if(g.src&&gs.length>1)h+='<span class="glnk">'+allNone(gi)+'</span>';
    h+='</div>';
  });
  var foot=!SRC.viewer?(SRC.sample?t("sampleNote"):t("pickRemember")):MERGE?t("pickMerged"):SRC.list[0].dev?t("pickDevice"):"";
  if(MERGE&&SRC.viewer&&SRC.list[0].dev)foot+=" "+t("pickDevice");
  if(foot)h+='<p class="foot">'+esc(foot)+'</p>';
  document.getElementById("pick").innerHTML=h;
}
document.getElementById("pick").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  var gs=groups();
  if(b.dataset.src!=null){var i=+b.dataset.src;srcPick[i]=!srcOn(i);}
  else if(b.dataset.all!=null){var v=b.dataset.all==="1";
    gs.forEach(function(g,gi){if(b.dataset.g!=null&&+b.dataset.g!==gi)return;g.items.forEach(function(it){pick[it.key]=v;});});}
  else if(b.dataset.i!=null){var g=gs[+b.dataset.g],it=g.items[+b.dataset.i];pick[it.key]=!isOn(it,g);}
  else return;
  savePick();render();
};

function render(){
  document.documentElement.lang=lang;
  ["title","sub","raw","back","note","optLog","optPrice","optSerial","include","papercap"].forEach(function(k){document.getElementById("t-"+k).textContent=t(k);});
  if(FROM_VIEWER)document.getElementById("t-sub").textContent=t("subViewer");
  document.getElementById("printBtn").textContent=t("print");
  document.title=t("title")+" — watchcafe.eu";
  // prices and serial numbers are off by default: a report is often shared (insurer, buyer, watchmaker)
  var opt={raw:document.getElementById("optRaw").checked,log:document.getElementById("optLog").checked,
    price:document.getElementById("optPrice").checked,serial:document.getElementById("optSerial").checked};
  document.getElementById("optPrice").disabled=document.getElementById("optSerial").disabled=!opt.log;
  document.getElementById("lblPrice").classList.toggle("dis",!opt.log);
  document.getElementById("lblSerial").classList.toggle("dis",!opt.log);
  if(FROM_VIEWER){var bk=document.getElementById("t-back");bk.textContent=t("backViewer");bk.href="viewer.html";}
  var gs=groups(),chosen=[],used=[];
  gs.forEach(function(g){var any=false;g.items.forEach(function(it){if(isOn(it,g)){chosen.push(it.w);any=true;}});if(any&&g.src)used.push(g.src);});
  if(SRC.viewer&&MERGE)used=SRC.list.filter(function(s,i){return srcOn(i);});
  renderPick(gs);
  var list=chosen.map(analyse);
  // ticked but nothing to show: say so, otherwise the box looks broken
  var anyPrice=chosen.some(function(w){return (w.log||[]).some(function(e){return e.cost;});});
  var anySerial=chosen.some(function(w){return infoOf(w).serial;});
  [["noPrice",opt.price&&!anyPrice],["noSerial",opt.serial&&!anySerial]].forEach(function(x){
    var el=document.getElementById(x[0]);el.hidden=!(opt.log&&x[1]&&chosen.length);el.textContent=t("noneFilled");});
  document.getElementById("sheets").innerHTML=list.length
    ?overview(list,{device:WatchData.getDevice(),sources:SRC.viewer?used:null},SRC.sample,opt)+list.map(function(a){return watchPage(a,opt);}).join("")
    :'<div class="pick-none">'+esc(t("pickNone"))+'</div>';
}
["optRaw","optLog","optPrice","optSerial"].forEach(function(id){document.getElementById(id).onchange=render;});
document.getElementById("printBtn").onclick=function(){window.print();};
window.addEventListener("swclang",function(e){lang=e.detail;render();});
render();
</script>
</body>
</html>
