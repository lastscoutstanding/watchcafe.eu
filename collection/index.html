<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection — watchcafe.eu</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script src="/nav.js" defer></script>
<script src="/watchdata.js?v=5"></script>
<script src="/watchrate/sample.js?v=5"></script>
<style>
  :root{
    --page:#121215; --card:#1c1c21; --card2:#202026; --border:#33333c;
    --accent:#d96a41; --accent-d:#c25a36; --ink:#e9e7e2; --muted:#a09da6;
    --nav-bg:#17171b; --nav-border:#2a2a31; --nav-hover:#22222a; --accent-glow:rgba(217,106,65,.7);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important} /* elements with their own display (grid, pills) still hide */
  html{color-scheme:dark}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding:28px 16px 60px}
  .wrap{max-width:948px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:30px 30px 34px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  @media(max-width:600px){.card{padding:22px 16px 26px}}
  h1{color:var(--accent);font-size:clamp(20px,3vw,30px);font-weight:800;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px}

  input[type=text],select{font:inherit;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#26262c;color:var(--ink);width:100%}
  label.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 5px}
  label.fld.req::after{content:" *";color:var(--accent)}
  button{font:inherit;cursor:pointer;border-radius:8px;padding:9px 14px;border:1px solid var(--border);background:#26262c;color:var(--ink);touch-action:manipulation}
  button:hover{background:#30303a}
  button:active{transform:scale(.98)}
  button.primary{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
  button.primary:hover{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
  button.sm{padding:6px 10px;font-size:13px}
  button.dash{background:transparent;border-style:dashed;color:var(--muted)}
  button.dash:hover{color:var(--ink)}
  button.armed{color:#ff6b5e;border-color:#ff6b5e;border-style:solid}
  .lab{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .notice{background:#2e221c;border:1px solid #45332a;color:#eda57f;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none}
  .note{font-size:13px;color:var(--muted);margin:12px 0 0;min-height:1em}

  /* overview: one card per watch */
  .wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:820px){.wgrid{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.wgrid{grid-template-columns:1fr}}
  .wc{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);text-decoration:none;min-width:0}
  .wc:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--card2)}
  .wc .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
  .wc .md{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .wc .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
  .f{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
  .f b{color:var(--ink);font-weight:600}
  .wc.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);min-height:110px;background:transparent;cursor:pointer;font:inherit}
  .wc.add .plus{font-size:26px;line-height:1}

  .box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:14px}
  .form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:700px){.form{grid-template-columns:1fr 1fr}}
  @media(max-width:420px){.form{grid-template-columns:1fr}}
  .formbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .empty{color:var(--muted);font-size:14.5px;line-height:1.6;padding:6px 0 4px}
  .empty p{margin:0 0 14px}
  .empty .row{display:flex;gap:8px;flex-wrap:wrap}

  /* detail */
  .back{background:none;border:none;color:var(--muted);padding:0;font-size:14px;margin:0 0 14px}
  .back:hover{background:none;color:var(--ink)}
  .ident h2{margin:0;font-size:24px;overflow-wrap:anywhere}
  .ident .ref{color:var(--muted);font-size:14px;margin-top:3px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:20px;overflow-x:auto}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:10px 14px;margin-bottom:-1px;font-weight:600;white-space:nowrap}
  .tabs button:hover{color:var(--ink);background:none}
  @media(max-width:480px){.tabs{gap:0}.tabs button{padding:10px 9px;font-size:14px}}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .pane{padding-top:20px}
  .meas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:700px){.meas{grid-template-columns:1fr}}
  .ms{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .ms .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .ms .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .ms .n.none{color:var(--muted);font-weight:400;font-size:16px;padding:5px 0}
  .ms .d{font-size:13px;color:var(--muted)}
  .ms a{font-size:13px;margin-top:auto;padding-top:8px;color:var(--accent);text-decoration:none;font-weight:600}
  .ms a:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  @media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
  .grid>div{background:var(--card2);padding:10px 14px;min-width:0}
  .grid .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .grid .v{font-size:15px;margin-top:3px;overflow-wrap:anywhere}
  .grid .v.none{color:#6d6a73}
  .serial{background:none;border:none;padding:0;color:var(--ink);font-size:15px}
  .serial:hover{background:none;color:var(--accent)}
  .detbtns{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}

  .f.warn{color:#ff9f43;border-color:color-mix(in srgb,#ff9f43 45%,transparent)}
  .pill{display:inline-block;font-size:12px;border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--muted);vertical-align:middle;margin-left:8px;font-weight:400}
  .former{margin-top:16px}
  .former .wgrid{margin-top:12px;opacity:.75}

  /* logbook */
  .loghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .svc{font-size:14px;color:var(--muted)}
  .svc b{color:var(--ink);font-weight:600}
  .svc.due b{color:#ff9f43}
  .types{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{border-radius:999px;padding:6px 13px;font-size:13.5px;border:1px solid var(--border);background:#26262c;color:var(--ink)}
  .chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
  .lform{display:grid;grid-template-columns:150px 1fr 140px;gap:12px}
  .lform .wide{grid-column:1/-1}
  @media(max-width:620px){.lform{grid-template-columns:1fr 1fr}.lform .where{grid-column:1/-1;order:-1}}
  input[type=date]{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#26262c;color:var(--ink);width:100%}
  .suggest{font-size:13px;color:var(--muted);margin-top:6px}
  .suggest button{font-size:13px;padding:3px 10px;border-radius:999px;border-style:dashed;background:transparent;color:var(--accent);margin-left:4px}
  .formbtns.split{justify-content:space-between}
  .formbtns.split span{display:flex;gap:8px}
  .tl{list-style:none;margin:0;padding:0;position:relative}
  .tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;border-left:1px solid var(--border)}
  .tl li{position:relative;padding:0 0 6px 44px}
  .tl .ic{position:absolute;left:0;top:4px;width:31px;height:31px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .tl .ic svg{width:16px;height:16px}
  .tl .it{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--ink)}
  .tl .it:hover{background:var(--card2);border-color:var(--border)}
  .tl .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .tl .h b{font-weight:600}
  .tl .dt{color:var(--muted);font-size:13px;white-space:nowrap}
  .tl .ds{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.5;overflow-wrap:anywhere}
  .tl .cost{color:var(--ink)}
  .tl.static .it{cursor:default}
  .tl.static .it:hover{background:none;border-color:transparent}
  .recent{margin-top:24px}
  .recent .lab{display:flex;justify-content:space-between;align-items:center}
  .recent .lab a{color:var(--accent);text-decoration:none;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;cursor:pointer}

  /* wearing today */
  .wear{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:24px}
  .wear .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .wear h2{font-size:17px;margin:0}
  .wear .hint{font-size:13px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips .chip{font-size:14px;padding:7px 14px}
  .chips .chip.on::before{content:"\2713  ";}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
  .week button{border:1px solid var(--border);border-radius:8px;padding:6px 4px;font-size:12px;color:var(--muted);text-align:center;background:transparent;min-width:0}
  .week button b{display:block;color:var(--ink);font-weight:600;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .week button b.none{color:#6d6a73;font-weight:400}
  /* narrow screens: no names in the strip (the chips show the chosen day), just a dot */
  @media(max-width:560px){
    .week button b{display:none}
    .week button::after{content:"";display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 1px;background:#3a3a44}
    .week button.has::after{background:var(--accent)}
  }
  .week button.sel{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .f.worn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .rot{margin-top:24px}
  .rotbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0 10px}
  .rotbar span{display:block}
  .rleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
  .rleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  /* worn tab */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .stat .n{font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .stat .t{font-size:12px;color:var(--muted)}
  .heatwrap{overflow-x:auto;margin-top:16px;padding-bottom:4px}
  .heat,.hmon{display:grid;grid-template-columns:repeat(53,11px);gap:3px}
  .heat{grid-template-rows:repeat(7,11px);grid-auto-flow:column}
  .heat i{width:11px;height:11px;border-radius:2px;background:#2a2a31}
  .heat i.w{background:var(--accent)}
  .heat i.o{background:color-mix(in srgb,var(--accent) 28%,#2a2a31)}
  .heat i.x{background:transparent}
  .hmon{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
  .legend{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  .gears{margin-top:20px;text-align:center;font-size:12.5px;color:#8f8c96}
  .gears a{color:var(--accent);text-decoration:none}
  .gears a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="notice" id="notice"></div>

    <!-- ===== overview ===== -->
    <div id="vOverview">
      <h1 id="title">Collection</h1>
      <p class="sub" id="sub"></p>
      <div id="overview"></div>
      <div class="box" id="addBox" hidden>
        <div class="form">
          <div><label class="fld req" for="addName" id="lblAddName"></label><input type="text" id="addName" autocomplete="off"></div>
          <div><label class="fld" for="addBrand" id="lblAddBrand"></label><input type="text" id="addBrand" autocomplete="off"></div>
          <div><label class="fld" for="addModel" id="lblAddModel"></label><input type="text" id="addModel" autocomplete="off"></div>
        </div>
        <div class="formbtns"><button class="sm" id="addCancel"></button><button class="sm primary" id="addSave"></button></div>
      </div>
      <p class="note" id="ovNote"></p>
    </div>

    <!-- ===== one watch ===== -->
    <div id="vDetail" hidden>
      <button class="back" id="backBtn"></button>
      <div class="ident"><h2><span id="dName"></span><span class="pill" id="dPill" hidden></span></h2><div class="ref" id="dRef"></div></div>
      <div class="tabs" id="tabs">
        <button data-tab="ov" id="tabOv"></button>
        <button data-tab="log" id="tabLog"></button>
        <button data-tab="worn" id="tabWorn"></button>
        <button data-tab="det" id="tabDet"></button>
      </div>
      <div class="pane" id="paneOv"></div>
      <div class="pane" id="paneLog" hidden></div>
      <div class="pane" id="paneWorn" hidden></div>
      <div class="pane" id="paneDet" hidden></div>
    </div>
  </div>
  <div class="gears" id="gears"></div>
</div>

function modelLine(w){var i=info(w);return [i.brand,i.model].filter(Boolean).join(" ");}
function refLine(w){
  var i=info(w),t=T(),parts=[];
  var m=modelLine(w);if(m)parts.push(m);

  if(i.caliber)parts.push(/^\d/.test(i.caliber)?t.calPfx+i.caliber:i.caliber);

function fmtRate(r){var v=r.rate;return (v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1);}
function humanSpan(ms){var d=ms/864e5,h=ms/36e5,nl=lang==="nl";
  if(d>=1)return d.toFixed(1)+(nl?" dagen":" days");if(h>=1)return h.toFixed(1)+(nl?" uur":" hours");return Math.round(ms/6e4)+" min";}

function svgIcon(type){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[type]||ICONS.note)+'</svg>';}
function dayStr(t){return new Date(t).toISOString().slice(0,10);}
function parseDay(s){var p=(s||"").split("-");return p.length===3?Date.UTC(+p[0],+p[1]-1,+p[2]):NaN;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

function fmtMonth(t){return new Date(t).toLocaleDateString(lang==="nl"?"nl-NL":"en-GB",{month:"short",year:"numeric",timeZone:"UTC"});}
function logOf(w){return (w.log||[]).slice().sort(function(a,b){return b.t-a.t||(b.id>a.id?1:-1);});}
function lastOf(w,types){return logOf(w).find(function(e){return types.indexOf(e.type)>-1;})||null;}

function isFormer(w){var e=lastOf(w,["purchase","sold"]);return !!(e&&e.type==="sold");}
// next service: the interval after the last service, or after the purchase if never serviced
function serviceInfo(w){
  var y=+info(w).serviceYears;if(!y||isFormer(w))return null;
  var base=lastOf(w,["service"])||lastOf(w,["purchase"]);if(!base)return null;
  var d=new Date(base.t);d.setUTCFullYear(d.getUTCFullYear()+y);

/* Event suggestions: café dates (meetings.txt, cafe-log.txt) and watch events
   (events.txt) from this site, so "Event" can prefill a name for that day. */
var SUGGEST=null;
function loadSuggest(){
  if(SUGGEST)return SUGGEST;
  function get(u){return fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).catch(function(){return "";});}
  var MONTHS=["january","february","march","april","may","june","july","august","september","october","november","december"];
  SUGGEST=Promise.all([get("/meetings.txt"),get("/cafe-log.txt"),get("/events.txt")]).then(function(x){
    var out=[],CAFE="Watch Café, Sioux Labs";
    x[0].split(/\r?\n/).forEach(function(l){var m=/^\s*(\d{4}-\d{2}-\d{2})/.exec(l);if(m){var d=parseDay(m[1]);out.push({a:d,b:d,name:CAFE});}});
    x[1].split(/\r?\n/).forEach(function(l){
      if(/^\s*#/.test(l))return;
      var m=/(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})\w*,?\s+(\d{4})/i.exec(l);
      if(m){var d=Date.UTC(+m[3],MONTHS.indexOf(m[1].toLowerCase()),+m[2]);out.push({a:d,b:d,name:CAFE});}
    });
    x[2].split(/\r?\n/).forEach(function(l){
      if(/^\s*#/.test(l)||l.indexOf("|")<0)return;
      var f=l.split("|").map(function(s){return s.trim();}),r=f[0].split("..");
      var a=parseDay(r[0]),b=r[1]?parseDay(r[1]):a;
      if(isFinite(a)&&f[1])out.push({a:a,b:b,name:f[1]+(f[2]?", "+f[2]:"")});
    });
    return out;
  });
  return SUGGEST;
}

/* ===== worn: w.worn = [{id, t}], t = the day at 00:00 UTC =====
   Two devices can log the same day under different ids; days are counted once. */
var DAY=864e5,PALETTE=["#d96a41","#5b9bff","#48c777","#d4af52","#b07cff","#4fc3c7","#ff7a9c","#a09da6"];
function todayT(){return parseDay(todayStr());}
function wornDays(w){var o={};(w.worn||[]).forEach(function(x){o[x.t]=1;});return o;}
function wornOn(w,day){return (w.worn||[]).some(function(x){return x.t===day;});}
function lastWorn(w){return (w.worn||[]).reduce(function(m,x){return Math.max(m,x.t);},0)||null;}
function toggleWorn(w,day){
  if(wornOn(w,day)){
    // undo: drop every entry for that day, also ones merged in from another device
    (w.worn||[]).forEach(function(x){if(x.t===day)WatchData.markDeleted(state,x.id);});
    w.worn=w.worn.filter(function(x){return x.t!==day;});
  }else{
    if(!Array.isArray(w.worn))w.worn=[];
    w.worn.push({id:uid(),t:day});w.worn.sort(function(a,b){return a.t-b.t;});
  }
  save();
}
function fmtWeekday(t,long){return new Date(t).toLocaleDateString(lang==="nl"?"nl-NL":"en-GB",long?{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}:{weekday:"short",timeZone:"UTC"});}

// "Wearing today": one tap per watch, with the last seven days to fix a forgotten day
function wearHTML(now){
  if(!now.length)return "";
  var t=T(),today=todayT(),day=wearDay||today,days=[];
  for(var i=6;i>=0;i--)days.push(today-i*DAY);
  return '<div class="wear"><div class="hd"><h2>'+esc(day===today?t.wearToday:t.wearOn(fmtWeekday(day,true)))+'</h2>'
    +'<span class="hint">'+esc(t.wearHint)+'</span></div>'
    +'<div class="chips">'+now.map(function(w){
      return '<button class="chip'+(wornOn(w,day)?' on':'')+'" data-wear="'+esc(w.id)+'">'+esc(w.name)+'</button>';
    }).join("")+'</div>'
    +'<div class="week">'+days.map(function(d){
      var names=now.filter(function(w){return wornOn(w,d);}).map(function(w){return w.name;});
      return '<button class="'+(d===day?'sel':'')+(names.length?' has':'')+'" data-day="'+d+'">'+esc(d===today?t.today:fmtWeekday(d))

    }).join("")+'</div></div>';
}
// share of worn days per watch over the last 12 months
function rotationHTML(){
  var t=T(),from=todayT()-364*DAY,rows=[],total=0;
  state.watches.forEach(function(w,i){
    var n=Object.keys(wornDays(w)).filter(function(d){return +d>=from;}).length;
    if(n){rows.push({w:w,n:n,c:PALETTE[i%PALETTE.length]});total+=n;}
  });
  if(!total)return "";
  rows.sort(function(a,b){return b.n-a.n;});
  var logged={};state.watches.forEach(function(w){Object.keys(wornDays(w)).forEach(function(d){if(+d>=from)logged[d]=1;});});
  return '<div class="rot"><p class="lab">'+esc(t.rotation)+' · '+esc(t.daysLogged(Object.keys(logged).length))+'</p>'
    +'<div class="rotbar">'+rows.map(function(r){return '<span style="width:'+(r.n/total*100)+'%;background:'+r.c+'"></span>';}).join("")+'</div>'
    +'<div class="rleg">'+rows.map(function(r){return '<span><i style="background:'+r.c+'"></i>'+esc(r.w.name)+' '+r.n+'</span>';}).join("")+'</div></div>';
}
var showFormer=false,wearDay=null; // wearDay: the day the chips apply to (null = today)
function renderOverview(){
  var t=T(),el=document.getElementById("overview");
  if(!state.watches.length){
    document.getElementById("addBox").hidden=true;
    el.innerHTML='<div class="empty"><p>'+esc(t.empty)+'</p><div class="row">'

      +'<button class="dash" id="emptySample">'+esc(t.loadSample)+'</button></div></div>';
    document.getElementById("emptyAdd").onclick=openAdd;

  }
  function card(w){

    if(pr)facts.push('<span class="f">'+esc(t.reserveF(pr.h))+'</span>');
    if(sv&&sv.overdue)facts.push('<span class="f warn">'+esc(t.svcPill)+'</span>');
    var lw=lastWorn(w);
    if(lw&&!isFormer(w)){var ago=Math.round((todayT()-lw)/DAY);if(ago>=0)facts.push('<span class="f'+(ago===0?' worn':'')+'">'+esc(ago===0?t.wornToday:t.wornAgo(ago))+'</span>');}

    return '<a class="wc" href="#'+encodeURIComponent(w.id)+'"><span class="nm">'+esc(w.name)+'</span>'
      +(md?'<span class="md">'+esc(md)+'</span>':'')
      +'<span class="facts">'+facts.join("")+'</span></a>';

  var now=state.watches.filter(function(w){return !isFormer(w);}),former=state.watches.filter(isFormer);

      +FIELDS.map(function(f){
        // explicit key order: numeric object keys would otherwise come first
        var opts={boxPapers:t.bp,serviceYears:t.svc}[f],keys={boxPapers:["","full","papers","box","none"],serviceYears:["","3","4","5","6","7","8","10"]}[f];
        if(opts)return '<div><label class="fld" for="e_'+f+'">'+esc(t.fields[f])+'</label><select id="e_'+f+'">'
          +keys.map(function(k){return '<option value="'+k+'"'+((i[f]||"")===k?" selected":"")+'>'+esc(opts[k])+'</option>';}).join("")+'</select></div>';
        return '<div><label class="fld" for="e_'+f+'">'+esc(t.fields[f])+'</label><input type="text" id="e_'+f+'" value="'+esc(i[f]||"")+'"'
          +(t.ph[f]?' placeholder="'+esc(t.ph[f])+'"':'')+' autocomplete="off"></div>';
      }).join("")
      +'</div><p class="note" id="detNote"></p>'
      +'<div class="formbtns"><button class="sm" id="eCancel">'+esc(t.cancel)+'</button><button class="sm primary" id="eSave">'+esc(t.save)+'</button></div>';
    document.getElementById("eCancel").onclick=function(){editing=false;render();};
    document.getElementById("eSave").onclick=function(){saveEdit(w);};
    el.querySelectorAll("input").forEach(function(inp){inp.addEventListener("keydown",function(e){if(e.key==="Enter")saveEdit(w);else if(e.key==="Escape"){editing=false;render();}});});
    document.getElementById("eName").focus();
    return;
  }
  el.innerHTML='<div class="grid">'+FIELDS.map(function(f){
      var v=i[f]||"",html;
      if(!v)html='<div class="v none">—</div>';
      else if(f==="boxPapers")html='<div class="v">'+esc(t.bp[v]||v)+'</div>';
      else if(f==="serviceYears")html='<div class="v">'+esc(t.svc[v]||v)+'</div>';
      else if(f==="serial"&&!serialShown)html='<div class="v"><button class="serial" id="serialBtn" title="'+esc(t.showSerial)+'">•••• '+esc(v.slice(-4))+'</button></div>';
      else html='<div class="v">'+esc(v)+'</div>';
      return '<div><div class="k">'+esc(t.fields[f])+'</div>'+html+'</div>';
    }).join("")
    +(function(){
      // purchase comes from the logbook, so it is edited there
      var p=lastOf(w,["purchase"]);
      function cell(k,v){return '<div><div class="k">'+esc(k)+'</div><div class="v'+(v?'':' none')+'">'+(v?esc(v):'—')+'</div></div>';}
      return cell(t.purchased,p?fmtDay(p.t)+(p.where?", "+p.where:""):"")+cell(t.price,p&&p.cost||"");
    })()+'</div>'
    +'<div class="detbtns"><button class="sm dash" id="delBtn">'+esc(t.del)+'</button><button class="sm primary" id="editBtn">'+esc(t.edit)+'</button></div>'
    +'<p class="note" id="detNote"></p>';
  var sb=document.getElementById("serialBtn");if(sb)sb.onclick=function(){serialShown=true;render();};
  document.getElementById("editBtn").onclick=function(){editing=true;disarm();render();};
  document.getElementById("delBtn").onclick=function(){deleteWatch(w,this);};
}
/* ===== worn tab: stats and a year of days, one square per day (weeks start on Monday) ===== */
function renderWorn(w){
  var t=T(),el=document.getElementById("paneWorn"),today=todayT(),from=today-364*DAY;
  var mine=wornDays(w),any={};
  state.watches.forEach(function(x){Object.keys(wornDays(x)).forEach(function(d){any[d]=1;});});
  var days=Object.keys(mine).map(Number).sort(function(a,b){return a-b;});
  if(!days.length){el.innerHTML='<p class="empty">'+esc(t.wornEmpty)+'</p>';return;}
  var inYear=days.filter(function(d){return d>=from;}).length;
  var logged=Object.keys(any).filter(function(d){return +d>=from;}).length;
  var streak=0,run=0,prev=null;
  days.forEach(function(d){run=prev!==null&&d-prev===DAY?run+1:1;streak=Math.max(streak,run);prev=d;});
  var last=days[days.length-1],ago=Math.round((today-last)/DAY);
  var lastTxt=ago===0?t.today:ago===1?(lang==="nl"?"Gisteren":"Yesterday"):fmtDay(last);
  function stat(n,txt){return '<div class="stat"><div class="n">'+esc(n)+'</div><div class="t">'+esc(txt)+'</div></div>';}
  // 53 columns of Monday..Sunday, ending with the current week
  var dow=(new Date(today).getUTCDay()+6)%7,start=today-dow*DAY-52*7*DAY,cells="",mons="",lastMon=-1,lastLbl=-9;
  for(var c=0;c<53;c++){
    var colStart=start+c*7*DAY,m=new Date(colStart).getUTCMonth();
    // label a column where a new month starts, unless the previous label is too close
    var lbl=m!==lastMon&&c-lastLbl>=3&&c<51;if(lbl)lastLbl=c;
    mons+='<span>'+(lbl?esc(new Date(colStart).toLocaleDateString(lang==="nl"?"nl-NL":"en-GB",{month:"short",timeZone:"UTC"})):"")+'</span>';
    lastMon=m;
    for(var r=0;r<7;r++){
      var d=colStart+r*DAY;
      cells+='<i class="'+(d>today?'x':mine[d]?'w':any[d]?'o':'')+'" title="'+esc(fmtDay(d))+'"></i>';
    }
  }
  el.innerHTML='<div class="stats">'
    +stat(inYear,t.stDays)
    +stat(logged?Math.round(inYear/logged*100)+"%":"—",t.stShare)
    +stat(lastTxt,t.stLast)
    +stat(streak,t.stStreak)+'</div>'
    +'<div class="heatwrap"><div class="heat">'+cells+'</div><div class="hmon">'+mons+'</div></div>'
    +'<div class="legend"><span><i style="background:var(--accent)"></i>'+esc(t.lgThis)+'</span>'
    +'<span><i style="background:color-mix(in srgb,var(--accent) 28%,#2a2a31)"></i>'+esc(t.lgOther)+'</span>'
    +'<span><i style="background:#2a2a31"></i>'+esc(t.lgNone)+'</span></div>';
  // on a narrow screen, start at the current week
  var hw=el.querySelector(".heatwrap");hw.scrollLeft=hw.scrollWidth;
}

/* ===== logbook tab ===== */
var logForm=null,logArmed=false,logArmTimer=null; // logForm = {id (null = new), type, vals}
function renderLog(w){
  var t=T(),el=document.getElementById("paneLog"),sv=serviceInfo(w),h="";
  h+='<div class="loghead"><span class="svc'+(sv&&sv.overdue?' due':'')+'">'
    +(sv?(sv.overdue?t.svcDue(esc(fmtMonth(sv.due))):t.svcNext(esc(fmtMonth(sv.due)),sv.years)):'')+'</span>'
    +(logForm?'':'<button class="sm dash" id="logAdd">'+esc(t.addEntry)+'</button>')+'</div>';
  if(logForm){
    var f=logForm,v=f.vals;
    h+='<div class="box" style="margin:0 0 18px"><div class="types">'
      +TYPES.map(function(k){return '<button class="chip'+(k===f.type?' on':'')+'" data-type="'+k+'">'+esc(t.types[k])+'</button>';}).join("")+'</div>'
      +'<div class="lform">'
      +'<div><label class="fld req" for="lgDate">'+esc(t.date)+'</label><input type="date" id="lgDate" value="'+esc(v.date)+'"></div>'
      +(t.whereLbl[f.type]?'<div class="where"><label class="fld" for="lgWhere">'+esc(t.whereLbl[f.type])+'</label><input type="text" id="lgWhere" value="'+esc(v.where)+'" placeholder="'+esc(t.wherePh[f.type]||"")+'" autocomplete="off"><div class="suggest" id="lgSuggest" hidden></div></div>':'')
      +(t.costLbl[f.type]?'<div><label class="fld" for="lgCost">'+esc(t.costLbl[f.type])+'</label><input type="text" id="lgCost" value="'+esc(v.cost)+'" placeholder="'+esc(t.costPh)+'" autocomplete="off"></div>':'')
      +'<div class="wide"><label class="fld" for="lgNote">'+esc(t.noteLbl)+'</label><input type="text" id="lgNote" value="'+esc(v.note)+'" placeholder="'+esc(t.notePh)+'" autocomplete="off"></div>'
      +'</div><p class="note" id="logNote"></p>'
      +'<div class="formbtns split"><span>'+(f.id?'<button class="sm dash" id="lgDel">'+esc(t.delEntry)+'</button>':'')+'</span>'
      +'<span><button class="sm" id="lgCancel">'+esc(t.cancel)+'</button><button class="sm primary" id="lgSave">'+esc(t.save)+'</button></span></div></div>';
  }
  var l=logOf(w);
  h+=l.length?'<ul class="tl">'+l.map(function(e){return entryHTML(e,true);}).join("")+'</ul>':'<p class="empty">'+esc(t.logEmpty)+'</p>';
  el.innerHTML=h;

  var add=document.getElementById("logAdd");
  if(add)add.onclick=function(){openLog(null,"purchase",{date:todayStr(),where:"",cost:"",note:""});};
  el.querySelectorAll("[data-entry]").forEach(function(b){
    b.onclick=function(){
      var e=(w.log||[]).find(function(x){return String(x.id)===b.dataset.entry;});if(!e)return;
      openLog(e.id,e.type,{date:dayStr(e.t),where:e.where||"",cost:e.cost||"",note:e.note||""});
    };
  });
  if(!logForm)return;
  el.querySelectorAll("[data-type]").forEach(function(b){
    b.onclick=function(){readLog();logForm.type=b.dataset.type;renderLog(w);};
  });
  document.getElementById("lgCancel").onclick=function(){logForm=null;logDisarm();renderLog(w);};
  document.getElementById("lgSave").onclick=function(){saveLog(w);};
  var del=document.getElementById("lgDel");if(del)del.onclick=function(){deleteLog(w,this);};
  el.querySelectorAll(".lform input").forEach(function(inp){
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&inp.type!=="date")saveLog(w);else if(e.key==="Escape"){logForm=null;renderLog(w);}});
  });
  document.getElementById("lgDate").addEventListener("change",suggestEvent);
  var wh=document.getElementById("lgWhere");if(wh)wh.addEventListener("input",suggestEvent);
  suggestEvent();
}
function openLog(id,type,vals){logForm={id:id,type:type,vals:vals};logDisarm();var w=byId(currentId());renderLog(w);
  var d=document.getElementById("lgWhere")||document.getElementById("lgNote");if(d)d.focus();}
function readLog(){
  var v=logForm.vals;
  [["date","lgDate"],["where","lgWhere"],["cost","lgCost"],["note","lgNote"]].forEach(function(x){
    var el=document.getElementById(x[1]);if(el)v[x[0]]=el.value;
  });
}
// For an event, offer the café or watch event on that day as its name
function suggestEvent(){
  var box=document.getElementById("lgSuggest");if(!box||!logForm||logForm.type!=="event"){if(box)box.hidden=true;return;}
  var day=parseDay(document.getElementById("lgDate").value);
  loadSuggest().then(function(list){
    var wh=document.getElementById("lgWhere"),bx=document.getElementById("lgSuggest");if(!wh||!bx)return;
    var m=list.find(function(x){return day>=x.a&&day<=x.b;});
    if(!m||wh.value.trim()===m.name){bx.hidden=true;return;}
    bx.innerHTML=esc(T().suggest)+'<button type="button">'+esc(m.name)+'</button>';
    bx.hidden=false;
    bx.querySelector("button").onclick=function(){wh.value=m.name;bx.hidden=true;wh.focus();};
  });
}
function saveLog(w){
  readLog();
  var t=T(),v=logForm.vals,day=parseDay(v.date);
  if(!isFinite(day)){document.getElementById("logNote").textContent=t.needDate;return;}
  var e={t:day,type:logForm.type};
  if(t.whereLbl[e.type]&&v.where.trim())e.where=v.where.trim();
  if(t.costLbl[e.type]&&v.cost.trim())e.cost=v.cost.trim();
  if(v.note.trim())e.note=v.note.trim();
  if(!Array.isArray(w.log))w.log=[];
  if(logForm.id){
    var i=w.log.findIndex(function(x){return x.id===logForm.id;});
    if(i>-1){e.id=logForm.id;e.edited=Date.now();w.log[i]=e;}
  }else{e.id=uid();w.log.push(e);}
  w.log.sort(function(a,b){return a.t-b.t;});
  save();logForm=null;render();
}
function logDisarm(){logArmed=false;clearTimeout(logArmTimer);}
function deleteLog(w,btn){
  var t=T();
  if(!logArmed){
    logArmed=true;btn.classList.add("armed");btn.textContent=t.delEntryAgain;
    logArmTimer=setTimeout(function(){logArmed=false;btn.classList.remove("armed");btn.textContent=t.delEntry;},5000);
    return;
  }
  logDisarm();
  var id=logForm.id;
  WatchData.markDeleted(state,id);
  w.log=(w.log||[]).filter(function(x){return x.id!==id;});
  save();logForm=null;render();
}
function saveEdit(w){
  var t=T(),name=document.getElementById("eName").value.trim();
  if(!name){document.getElementById("detNote").textContent=t.needName;document.getElementById("eName").focus();return;}
  var i={};
  FIELDS.forEach(function(f){var v=document.getElementById("e_"+f).value.trim();if(v)i[f]=v;});
  if(name!==w.name||JSON.stringify(i)!==JSON.stringify(info(w))){
    w.name=name;
    if(Object.keys(i).length)w.info=i;else delete w.info;
    w.edited=Date.now();
    save();
  }
  editing=false;render();
}
/* two-step delete, like the Rate Meter used to have: arm, then confirm within 5 s */
var armed=null,armTimer=null;
function disarm(){armed=null;clearTimeout(armTimer);}
function deleteWatch(w,btn){
  var t=T();
  if(armed!==w.id){
    armed=w.id;btn.classList.add("armed");btn.textContent=t.delAgain;
    document.getElementById("detNote").textContent=t.delArmed(w.name);
    armTimer=setTimeout(function(){disarm();if(currentId()===String(w.id)&&!editing)render();},5000);
    return;
  }
  disarm();
  WatchData.markWatchDeleted(state,w);
  state.watches=state.watches.filter(function(x){return x.id!==w.id;});
  if(state.activeWatch===w.id)state.activeWatch=state.watches.length?state.watches[0].id:null;
  save();
  history.replaceState(null,"",location.pathname);
  tab="ov";render();
  document.getElementById("ovNote").textContent=t.deleted(w.name);
}

/* ===== static texts ===== */
function applyLang(){
  var t=T();
  document.getElementById("title").textContent=t.title;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("lblAddName").textContent=t.name;
  document.getElementById("addName").placeholder=t.namePh;
  document.getElementById("lblAddBrand").textContent=t.fields.brand;
  document.getElementById("lblAddModel").textContent=t.fields.model;
  document.getElementById("addCancel").textContent=t.cancel;
  document.getElementById("addSave").textContent=t.add;
  document.getElementById("gears").innerHTML=esc(t.gears)+'<a href="/privacy/">'+esc(t.gearsLink)+'</a>';
  document.documentElement.lang=lang;
  showNotice();
}

/* ===== events ===== */
document.getElementById("addSave").onclick=addWatch;
document.getElementById("addCancel").onclick=function(){closeAdd();document.getElementById("ovNote").textContent="";};
["addName","addBrand","addModel"].forEach(function(id){
  document.getElementById(id).addEventListener("keydown",function(e){if(e.key==="Enter")addWatch();else if(e.key==="Escape")closeAdd();});
});
document.getElementById("backBtn").onclick=function(){location.hash="";};
document.querySelectorAll("#tabs button").forEach(function(b){
  b.onclick=function(){tab=b.dataset.tab;editing=false;logForm=null;disarm();render();};
});
window.addEventListener("hashchange",function(){
  if(!location.hash)history.replaceState(null,"",location.pathname);
  tab="ov";editing=false;logForm=null;serialShown=false;disarm();
  document.getElementById("ovNote").textContent="";
  render();window.scrollTo(0,0);
});
// another tab (Rate Meter, Power Reserve) changed the data
window.addEventListener("storage",function(e){if(e.key===KEY&&!editing&&!logForm){reload();render();}});
window.addEventListener("swclang",function(e){lang=e.detail;applyLang();render();});

reload();
applyLang();
render();
</script>
