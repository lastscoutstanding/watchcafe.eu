<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complications — watchcafe.eu</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script src="/nav.js" defer></script>
<script src="worldmap.js?v=2"></script>
<script src="gmt.js?v=2"></script>
<style>
  :root{
    --page:#121215; --card:#1c1c21; --card2:#202026; --border:#33333c;
    --accent:#d96a41; --accent-d:#c25a36; --ink:#e9e7e2; --muted:#a09da6;
    --amber:#ff8a3c; --amber-glow:rgba(255,138,60,.6); --banner:#b06a4a;
    --nav-bg:#17171b; --nav-border:#2a2a31; --nav-hover:#22222a; --accent-glow:rgba(217,106,65,.7);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding:28px 16px 60px}
  [hidden]{display:none!important}
  .wrap{max-width:948px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:30px 30px 34px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
  h1{color:var(--accent);font-size:clamp(20px,3vw,30px);font-weight:800;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .help-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#26262c;color:var(--muted);font-weight:700;font-size:15px;padding:0;line-height:1;cursor:pointer;flex:none}
  .help-btn:hover{background:#30303a;color:var(--ink)}
  label.fld{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 5px}
  select{font:inherit;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#26262c;color:var(--ink);width:100%}
  button{font:inherit;cursor:pointer;border-radius:8px;padding:9px 14px;border:1px solid var(--border);background:#26262c;color:var(--ink);touch-action:manipulation}
  button:hover{background:#30303a}
  button.dash{background:transparent;border-style:dashed;color:var(--muted)}
  button.dash:hover{color:var(--ink)}
  button.sm{padding:5px 10px;font-size:12.5px}

  .guide{margin:0 0 18px;background:#241d1a;border:1px solid #45332a;border-radius:12px;padding:18px 20px}
  .guide-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .guide-head span{font-weight:700;color:var(--accent);font-size:15px}
  .guide-x{border:none;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px}
  .guide-x:hover{background:transparent;color:var(--ink)}
  .guide-intro{margin:0 0 12px;font-size:14px;line-height:1.5}
  .guide-steps{margin:0;padding:0;list-style:none;counter-reset:gs}
  .guide-steps li{counter-increment:gs;position:relative;padding:0 0 10px 34px;font-size:14px;line-height:1.5}
  .guide-steps li:before{content:counter(gs);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .guide-steps li:last-child{padding-bottom:0}

  /* day strip: stays at the top while scrolling, so the moon is in view while you slide */
  /* top: below the fixed menu bar of nav.js (52 px + 1 px border) */
  .strip{position:sticky;top:53px;z-index:5;background:var(--card);margin:0 -30px 22px;padding:12px 30px 10px;border-bottom:1px solid var(--border)}
  .days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .days::-webkit-scrollbar{display:none}
  .days .d{flex:0 0 44px;border:1px solid transparent;border-radius:8px;padding:4px 0;text-align:center;background:transparent;color:var(--muted);font-size:11px;line-height:1.2}
  .days .d:hover{background:#2a2a31}
  .days .d svg{width:22px;height:22px;display:block;margin:2px auto}
  .days .d .w{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#6f6c76}
  .days .d.today{color:var(--ink);font-weight:700}
  .days .d.today .w{color:var(--ink)}
  .days .d.sel{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .striprow{display:flex;gap:14px;align-items:center;margin-top:6px}
  .slider{flex:1;min-width:0}
  .slider .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:2px}
  .slider .top b{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:28px}
  .mini{display:none;flex:none}
  .mini svg{width:92px;height:48px;display:block}
  @media(max-width:760px){.mini{display:block}}
  @media(max-width:520px){
    .card{padding:22px 16px 26px}
    .strip{margin:0 -16px 18px;padding:10px 16px 8px}
    .striprow{gap:10px}
    .mini svg{width:76px;height:40px}
  }

  .grid{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
  .ptitle{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px}
  .sky{display:flex;gap:16px;align-items:center}
  .sky svg{width:96px;height:96px;flex:none}
  .pname{font-size:19px;font-weight:700;margin:0 0 4px}
  .pfact{font-size:13.5px;color:var(--muted);line-height:1.5}
  .dates{margin:16px 0 0;padding:12px 0 0;border-top:1px dashed var(--border);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
  .dates dt{color:var(--muted)} .dates dd{margin:0}

  .typebox{margin-bottom:18px;max-width:340px}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.steps{grid-template-columns:1fr}}
  .step{border:1px solid var(--border);border-radius:10px;padding:14px 14px 12px}
  .step h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center}
  .num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .num.ok{background:#4a4a55}
  .ap{width:100%;max-width:240px;display:block;margin:0 auto}
  .presses{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:8px 0 4px}
  .presses b{font-size:64px;line-height:1;color:var(--amber);text-shadow:0 0 14px var(--amber-glow);font-variant-numeric:tabular-nums}
  .presses span{color:var(--muted);font-size:15px}
  .cap{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 0 0;line-height:1.45}
  .result{margin-top:14px;border-style:dashed}
  .hint{font-size:12.5px;color:var(--muted);margin:14px 0 0;line-height:1.55}
  .warn{color:#eda57f}

  /* tabs: Moon phase · GMT */
  .hdr-r{display:flex;gap:10px;align-items:center}
  .tabs,.seg{display:inline-flex;border:1px dashed var(--border);border-radius:999px;padding:3px;gap:2px}
  .tabs button,.seg button{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:999px;padding:5px 14px;font-size:13px}
  .tabs button:hover,.seg button:hover{background:transparent;color:var(--ink)}
  .tabs button.on,.seg button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
  @media(max-width:520px){.hdr{flex-wrap:wrap}.hdr-r{width:100%;justify-content:space-between}}

  /* GMT: place pills, map, dial, steps */
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .pill{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 5px;background:transparent;color:var(--muted);font-size:13px}
  .pill:hover{background:#26262c}
  .pill b{color:var(--ink);font-weight:600}
  .pill.on{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .pill .k{width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#15151a;flex:none}
  .pill .x{border:1px dashed var(--border);border-radius:999px;font-size:11.5px;padding:0 8px;margin-left:2px;color:var(--muted)}
  .pill .x:hover{color:var(--ink)}
  .mapw{background:#141418;border:1px solid var(--border);border-radius:12px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .mapw svg{width:100%;display:block}
  @media(max-width:600px){.mapw svg{width:860px}}
  .swipe{display:none;font-size:11.5px;color:#6f6c76;text-align:center;margin:6px 0 0}
  @media(max-width:600px){.swipe{display:block}}
  .dot{cursor:pointer}
  .dot .hit{fill:transparent}
  .dot:hover .v{fill:#e9e7e2}
  .g-grid{grid-template-columns:260px 1fr;margin-top:20px}
  @media(max-width:760px){.g-grid{grid-template-columns:1fr}.g-grid .panel{max-width:340px}}
  #gDial{width:100%;display:block}
  .g-rows{font-size:13px;margin-top:10px}
  .g-rows div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:var(--muted)}
  .g-rows b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .g-typerow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .g-typerow select{width:auto;max-width:100%}
  .g-thint{margin:8px 0 16px}
  .g-steps{list-style:none;margin:0;padding:0;counter-reset:gs}
  .g-steps li{counter-increment:gs;position:relative;padding:0 0 14px 34px;font-size:14px;line-height:1.5}
  .g-steps li:before{content:counter(gs);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .g-steps b{color:var(--accent)}
  .g-dst{border-top:1px dashed var(--border);padding-top:10px}

  .banner{margin-top:26px;background:var(--banner,#b06a4a);color:#fff;font-weight:700;text-align:center;padding:16px;border-radius:8px;font-size:15px}
  .gears{margin-top:14px;text-align:center;font-size:12.5px;color:#8f8c96}
  .gears a{color:var(--accent);text-decoration:none}
  .gears a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr">
      <div>
        <h1 id="title">Complications</h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="hdr-r">
        <div class="tabs" id="tabs"><button data-tab="moon" id="tabMoon">Moon phase</button><button data-tab="gmt" id="tabGmt">GMT</button></div>
        <button class="help-btn" id="helpBtn" aria-label="How it works">?</button>
      </div>
    </div>

    <div id="paneMoon">

    <div class="guide" id="guide" hidden>
      <div class="guide-head">
        <span id="guideTitle"></span>
        <button class="guide-x" id="guideClose" aria-label="Close">&times;</button>
      </div>
      <p class="guide-intro" id="guideIntro"></p>
      <ol class="guide-steps"><li id="gStep1"></li><li id="gStep2"></li><li id="gStep3"></li></ol>
    </div>

    <div class="strip">
      <div class="days" id="days"></div>
      <div class="striprow">
        <div class="slider">
          <div class="top"><span id="dayLbl"></span><b id="timeLbl"></b></div>
          <input type="range" id="time" min="0" max="1425" step="15">
        </div>
        <div class="mini" aria-hidden="true"><svg viewBox="0 0 200 104" id="apMini"></svg></div>
        <button class="dash sm" id="nowBtn"></button>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <p class="ptitle" id="skyTitle"></p>
        <div class="sky">
          <svg viewBox="0 0 100 100" id="skySvg" aria-hidden="true"></svg>
          <div><p class="pname" id="pname"></p><div class="pfact" id="pfact"></div></div>
        </div>
        <dl class="dates" id="dates"></dl>
      </div>

      <div>
        <div class="typebox"><label class="fld" for="type" id="typeLbl"></label>
          <select id="type"><option value="std"></option><option value="prec"></option></select></div>

        <div class="steps" id="stdSteps">
          <div class="step">
            <h3><span class="num">1</span><span id="s1h"></span></h3>
            <svg class="ap" viewBox="0 0 200 104" id="apFull" aria-hidden="true"></svg>
            <p class="cap" id="s1c"></p>
          </div>
          <div class="step">
            <h3><span class="num">2</span><span id="s2h"></span></h3>
            <div class="presses"><b id="n">0</b><span id="times"></span></div>
            <p class="cap" id="ncap"></p>
          </div>
        </div>

        <div class="step result">
          <h3 id="resTitle"></h3>
          <svg class="ap" viewBox="0 0 200 104" id="apNow" aria-hidden="true"></svg>
          <p class="cap" id="rescap"></p>
        </div>

        <p class="hint warn" id="warnLine"></p>
        <p class="hint" id="driftLine"></p>
      </div>
    </div>

    </div><!-- /paneMoon -->

    <div id="paneGmt" hidden>
      <div class="guide" id="gGuide" hidden>
        <div class="guide-head">
          <span id="gGuideTitle"></span>
          <button class="guide-x" id="gGuideClose" aria-label="Close">&times;</button>
        </div>
        <p class="guide-intro" id="gGuideIntro"></p>
        <ol class="guide-steps"><li id="gG1"></li><li id="gG2"></li><li id="gG3"></li></ol>
      </div>
      <div class="pills" id="gPills"></div>
      <div class="mapw" id="gMapW"><svg id="gMap" aria-label="World map"></svg></div>
      <p class="swipe" id="gSwipe"></p>
      <div class="grid g-grid">
        <div class="panel">
          <svg id="gDial" viewBox="0 0 220 220" aria-hidden="true"></svg>
          <div class="g-rows" id="gRows"></div>
        </div>
        <div>
          <label class="fld" id="gTypeLbl"></label>
          <div class="g-typerow">
            <select id="gWatch" hidden></select>
            <div class="seg" id="gSeg"><button data-t="flyer" id="gFlyer">Flyer</button><button data-t="caller" id="gCaller">Caller</button></div>
          </div>
          <p class="hint g-thint" id="gTHint"></p>
          <ol class="g-steps" id="gSteps"></ol>
          <p class="hint warn" id="gWarn" hidden></p>
          <p class="hint g-dst" id="gDst"></p>
        </div>
      </div>
    </div>

    <div class="banner" id="banner"></div>
    <div class="gears" id="gears"></div>
  </div>
</div>

var LKEY="siouxWatchRateMeterLang", TKEY="siouxWatchMoonType";
var lang=(function(){try{return localStorage.getItem(LKEY)==="nl"?"nl":"en";}catch(e){return "en";}})();
function tr(k,vars){var s=I18N[lang][k];if(vars)for(var p in vars)s=s.replace("{"+p+"}",vars[p]);return s;}
function setTxt(id,txt){document.getElementById(id).textContent=txt;}

/* ===== moon maths =====
   True new and full moons after Meeus, Astronomical Algorithms ch. 49 (main
   terms): within a minute or two of the published times. */
var SYN=29.530588861, D=864e5;
function phaseTime(k){ // k integer = new moon, k + 0.5 = full moon; returns epoch ms (UTC)
  var T=k/1236.85,r=Math.PI/180,s=Math.sin;
  var j=2451550.09766+SYN*k+0.00015437*T*T;
  var M=(2.5534+29.10535670*k)*r,Mp=(201.5643+385.81693528*k)*r,F=(160.7108+390.67050284*k)*r,E=1-0.002516*T;
  var a=(k%1)?[-0.40614,0.17302,0.01614,0.01043,0.00734,-0.00515,0.00209]:[-0.40720,0.17241,0.01608,0.01039,0.00739,-0.00514,0.00208];
  j+=a[0]*s(Mp)+a[1]*E*s(M)+a[2]*s(2*Mp)+a[3]*s(2*F)+a[4]*E*s(Mp-M)+a[5]*E*s(Mp+M)+a[6]*E*E*s(2*M)
    -0.00111*s(Mp-2*F)-0.00057*s(Mp+2*F)+0.00056*E*s(2*Mp+M)-0.00042*s(3*Mp)+0.00042*E*s(M+2*F)+0.00038*E*s(M-2*F)-0.00024*E*s(2*Mp-M);
  return (j-2440587.5)*D-69e3; // terrestrial time -> UTC (delta T ~69 s)
}
// k of the last new (full=false) or full moon at or before t
function lastPhase(t,full){
  var off=full?.5:0,k=Math.floor(((t/D+2440587.5)-2451550.1)/SYN-off)+off+1;
  while(phaseTime(k)>t)k--;
  return k;
}
/* Where a moon disc should stand at t, in watch days since full moon (0 to 29.5).
   The real moon takes 13.9 to 15.6 days from full to new and back, the watch
   always 14.75. Interpolating between the real full and new moons puts both
   exactly right, so the moon is never visible at new moon or off-centre at full. */
var WATCH=29.5;
function watchPos(t){
  var kF=lastPhase(t,true),kN=lastPhase(t,false),k0=Math.max(kF,kN),t0=phaseTime(k0),t1=phaseTime(k0+.5);
  return (k0%1?0:WATCH/2)+WATCH/2*(t-t0)/(t1-t0);
}
// presses from a centred full moon: the nearest whole number, wrapping to 0 just before full
function pressesFor(pos){var n=Math.round(pos);return n>=WATCH||WATCH-pos<Math.abs(pos-n)?0:n;}
function ageAt(t){return (t-phaseTime(lastPhase(t,false)))/D;}

/* ===== drawings ===== */
// the moon in the sky, as seen from the northern hemisphere
function skyMoon(age,ring){
  var p=age/SYN,r=40,c=50,rx=Math.abs(Math.cos(2*Math.PI*p))*r,wax=p<.5,gib=(p>.25&&p<.75);
  var d="M"+c+","+(c-r)+" A"+r+","+r+" 0 0 "+(wax?1:0)+" "+c+","+(c+r)+" A"+rx.toFixed(2)+","+r+" 0 0 "+((wax?gib:!gib)?1:0)+" "+c+","+(c-r)+"Z";
  return '<circle cx="50" cy="50" r="40" fill="#2a2a33"/><path d="'+d+'" fill="#f1e6c4"/>'+
    '<circle cx="50" cy="50" r="40" fill="none" stroke="'+(ring?"var(--accent)":"#44444f")+'" stroke-width="'+(ring?7:1)+'"/>';
}
// a classic moonphase window: a disc with two moons turning behind two humps;
// f = fraction of the cycle since full moon: 0 = full moon centred, .5 = new moon.
// The humps are a little larger than the moons, so around new moon the moon
// is hidden for about a day, as on a real watch.
function aperture(f,id){
  var th=f*Math.PI,R=60,cx=100,cy=100,mr=29,moons="",stars="";
  for(var i=0;i<2;i++){var a=th+i*Math.PI;moons+='<circle cx="'+(cx+R*Math.sin(a)).toFixed(1)+'" cy="'+(cy-R*Math.cos(a)).toFixed(1)+'" r="'+mr+'" fill="url(#gold'+id+')"/>';}
  [[40,40],[160,36],[100,18],[70,22],[132,24],[24,70],[178,72]].forEach(function(s,i){
    var x=s[0]-cx,y=s[1]-cy,X=cx+x*Math.cos(th)-y*Math.sin(th),Y=cy+x*Math.sin(th)+y*Math.cos(th);
    stars+='<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="'+(i%2?1.3:1.8)+'" fill="#e9d9a6" opacity=".8"/>';});
  return '<defs><radialGradient id="gold'+id+'" cx=".4" cy=".35"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c9a24a"/></radialGradient>'+
    '<clipPath id="win'+id+'"><path d="M8,100 A92,92 0 0 1 192,100 Z"/></clipPath></defs>'+
    '<g clip-path="url(#win'+id+')"><rect x="0" y="0" width="200" height="104" fill="#14234f"/>'+stars+moons+
    '<circle cx="40" cy="100" r="35" fill="#2b2b33" stroke="#4a4a55"/><circle cx="160" cy="100" r="35" fill="#2b2b33" stroke="#4a4a55"/></g>'+
    '<path d="M8,100 A92,92 0 0 1 192,100" fill="none" stroke="#6a6a75" stroke-width="2"/><line x1="4" y1="101" x2="196" y2="101" stroke="#6a6a75" stroke-width="2"/>'+
    '<line x1="100" y1="3" x2="100" y2="11" stroke="var(--accent)" stroke-width="2"/>';
}
// new/full moon within 12 hours of the real moment, quarters by the age
function phaseName(t){
  var kN=lastPhase(t,false),kF=lastPhase(t,true),H=12*36e5;
  if(t-phaseTime(kN)<H||phaseTime(kN+1)-t<H)return tr("phases")[0];
  if(t-phaseTime(kF)<H||phaseTime(kF+1)-t<H)return tr("phases")[4];
  var p=ageAt(t)/SYN,lim=[.0169,.2331,.2669,.5,.7331,.7669];
  var idx=[1,1,2,3,5,6,7];
  for(var i=0;i<lim.length;i++)if(p<lim[i])return tr("phases")[idx[i]];
  return tr("phases")[7];
}

/* ===== state: chosen day (local midnight) + minutes into it ===== */
var STRIP_BACK=14, STRIP_AHEAD=60;
function midnight(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function addDays(day,n){var d=new Date(day);d.setDate(d.getDate()+n);return d.getTime();}
var day, mins;
function setNow(){var n=new Date();day=midnight(n);mins=Math.floor((n.getHours()*60+n.getMinutes())/15)*15;}
function chosen(){var d=new Date(day);d.setMinutes(mins);return d.getTime();}
function atNow(){return day===midnight(Date.now())&&Math.abs(new Date().getHours()*60+new Date().getMinutes()-mins)<15;}
var type=(function(){try{return localStorage.getItem(TKEY)==="prec"?"prec":"std";}catch(e){return "std";}})();
setNow();

function fmt(t){return new Date(t).toLocaleString(tr("locale"),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
function hhmm(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}

// the strip is rebuilt on a day or language change, never while the slider is dragged
function buildStrip(){
  var today=midnight(Date.now()),h="",from=addDays(today,-STRIP_BACK),to=addDays(today,STRIP_AHEAD+1),evs=[];
  // true new and full moons in the strip, so each lands on its own local day
  for(var k=lastPhase(from,false);phaseTime(k)<to;k+=.5)evs.push([phaseTime(k),k%1?tr("fullM"):tr("newM")]);
  for(var i=-STRIP_BACK;i<=STRIP_AHEAD;i++){
    var dd=addDays(today,i),nx=addDays(dd,1),dt=new Date(dd),ev="";
    evs.forEach(function(e){if(e[0]>=dd&&e[0]<nx)ev=e[1];});
    var w=i===0?tr("today"):dt.toLocaleDateString(tr("locale"),{weekday:"short"}).replace(".","");
    var lbl=dt.getDate()+((dt.getDate()===1||i===-STRIP_BACK)?" "+dt.toLocaleDateString(tr("locale"),{month:"short"}).replace(".",""):"");
    h+='<button class="d'+(i===0?" today":"")+(dd===day?" sel":"")+'" data-day="'+dd+'"'+(ev?' title="'+ev+'"':"")+'>'+
      '<span class="w">'+w+'</span><svg viewBox="0 0 100 100" aria-hidden="true">'+skyMoon(ageAt(dd+12*36e5),!!ev)+'</svg>'+lbl+'</button>';
  }
  document.getElementById("days").innerHTML=h;
}
function centreStrip(smooth){
  var s=document.querySelector("#days .sel"),box=document.getElementById("days");
  if(s)box.scrollTo({left:s.offsetLeft-box.offsetLeft-(box.clientWidth-s.offsetWidth)/2,behavior:smooth?"smooth":"auto"});
}

function render(){
  var t=chosen(),age=ageAt(t),kF=lastPhase(t,true),fullT=phaseTime(kF),sinceFull=(t-fullT)/D,kN=lastPhase(t,false);
  var lit=Math.round((1-Math.cos(2*Math.PI*age/SYN))/2*100),prec=type==="prec",pos=watchPos(t),n=pressesFor(pos);
  setTxt("dayLbl",new Date(day).toLocaleDateString(tr("locale"),{weekday:"short",day:"numeric",month:"short",year:"numeric"}));
  setTxt("timeLbl",hhmm(mins));
  var sl=document.getElementById("time");if(document.activeElement!==sl)sl.value=mins;
  document.getElementById("nowBtn").hidden=atNow();
  setTxt("skyTitle",atNow()?tr("moonNow"):tr("moonOn",{d:new Date(t).toLocaleDateString(tr("locale"),{day:"numeric",month:"short"})+", "+hhmm(mins)}));
  document.getElementById("skySvg").innerHTML=skyMoon(age);
  setTxt("pname",phaseName(t));
  document.getElementById("pfact").innerHTML=tr("daysOld",{n:age.toFixed(1).replace(".",lang==="nl"?",":".")})+"<br>"+tr("lit",{n:lit});
  document.getElementById("dates").innerHTML="<dt>"+tr("lastFull")+"</dt><dd>"+fmt(fullT)+"</dd><dt>"+tr("nextNew")+"</dt><dd>"+fmt(phaseTime(kN+1))+"</dd><dt>"+tr("nextFull")+"</dt><dd>"+fmt(phaseTime(kF+1))+"</dd>";
  document.getElementById("stdSteps").hidden=prec;
  setTxt("n",n);
  setTxt("ncap",tr("ncap",{d:fmt(fullT)}));
  document.getElementById("resTitle").innerHTML=prec?tr("resPrec"):'<span class="num ok">✓</span>'+tr("resStd");
  var shown=(prec?pos:n)/WATCH;
  document.getElementById("apNow").innerHTML=aperture(shown,"n");
  document.getElementById("apMini").innerHTML=aperture(shown,"m");
  var x=sinceFull.toFixed(1);if(lang==="nl")x=x.replace(".",",");
  setTxt("rescap",prec?tr("capPrec",{x:x}):tr("capStd",{x:x,n:n}));
  setTxt("driftLine",tr(prec?"driftPrec":"driftStd"));
}
function applyStatic(){
  setTxt("title",tr("title"));setTxt("tabMoon",tr("tabMoon"));setTxt("tabGmt",tr("tabGmt"));
  setTxt("sub",tab==="gmt"&&window.GMT?GMT.sub():tr("sub"));setTxt("nowBtn",tr("now"));
  setTxt("typeLbl",tr("typeLbl"));
  var o=document.getElementById("type").options;o[0].text=tr("typeStd");o[1].text=tr("typePrec");
  document.getElementById("type").value=type;
  setTxt("s1h",tr("s1h"));setTxt("s1c",tr("s1c"));setTxt("s2h",tr("s2h"));setTxt("times",tr("times"));
  setTxt("warnLine",tr("warn"));
  setTxt("guideTitle",tr("guideTitle"));setTxt("guideIntro",tr("guideIntro"));
  ["gStep1","gStep2","gStep3"].forEach(function(k){document.getElementById(k).innerHTML=tr(k);});
  document.getElementById("helpBtn").setAttribute("aria-label",tr("guideTitle"));
  setTxt("banner",tr("banner"));
  document.getElementById("gears").innerHTML=tr("gears")+'<a href="/privacy/">'+tr("gearsLink")+"</a>";
  document.documentElement.lang=lang;
}

/* ===== events ===== */
document.getElementById("time").addEventListener("input",function(e){mins=+e.target.value;render();});
document.getElementById("days").addEventListener("click",function(e){
  var b=e.target.closest("[data-day]");if(!b)return;
  day=+b.dataset.day;
  document.querySelectorAll("#days .sel").forEach(function(x){x.classList.remove("sel");});
  b.classList.add("sel");centreStrip(true);render();
});
document.getElementById("nowBtn").onclick=function(){setNow();buildStrip();centreStrip(true);render();};
document.getElementById("type").onchange=function(e){type=e.target.value;try{localStorage.setItem(TKEY,type);}catch(err){}render();};
document.getElementById("helpBtn").onclick=function(){var g=document.getElementById(tab==="gmt"?"gGuide":"guide");g.hidden=!g.hidden;};
document.getElementById("guideClose").onclick=function(){document.getElementById("guide").hidden=true;};
window.addEventListener("swclang",function(e){lang=e.detail==="nl"?"nl":"en";applyStatic();buildStrip();centreStrip(false);render();});
// back/forward cache: start again from now, with the type chosen on another page load
window.addEventListener("pageshow",function(e){if(e.persisted){setNow();buildStrip();centreStrip(false);render();}});

/* ===== tabs: #moon (default) and #gmt; the hash keeps the tab across reloads and links ===== */
var tab="moon";
function showTab(t,push){
  tab=t==="gmt"?"gmt":"moon";
  document.getElementById("paneMoon").hidden=tab!=="moon";
  document.getElementById("paneGmt").hidden=tab!=="gmt";
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab);});
  if(push)history.replaceState(null,"","#"+tab);
  applyStatic();
  if(tab==="moon"){centreStrip(false);render();}
  else if(window.GMT)GMT.show();
}
document.getElementById("tabs").onclick=function(e){var b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab,true);};
window.addEventListener("hashchange",function(){showTab(location.hash.slice(1),false);});

/* ===== init ===== */
document.getElementById("apFull").innerHTML=aperture(0,"f");
buildStrip();showTab(location.hash.slice(1),false);
</script>
</body>
