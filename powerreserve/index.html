<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Reserve — watchcafe.eu</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  :root{
    --page:#121215; --card:#1c1c21; --card2:#202026; --border:#33333c;
    --accent:#d96a41; --accent-d:#c25a36; --ink:#e9e7e2; --muted:#a09da6;
    --panel-1:#1c1c1c; --panel-2:#0b0b0b;
    --amber:#ff8a3c; --amber-off:#3a1e0a; --amber-glow:rgba(255,138,60,.75); --green:#3be35b; --green-off:#0c2a17; --green-glow:rgba(59,227,91,.7); --banner:#b06a4a;
    --nav-bg:#17171b; --nav-border:#2a2a31; --nav-hover:#22222a; --accent-glow:rgba(217,106,65,.7);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding:28px 16px 60px}
  .wrap{max-width:948px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:30px 30px 34px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
  h1{color:var(--accent);font-size:clamp(20px,3vw,30px);font-weight:800;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .hdr-right{display:flex;align-items:center;gap:10px;flex:none}
  .help-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#26262c;color:var(--muted);font-weight:700;font-size:15px;padding:0;line-height:1;cursor:pointer}
  .help-btn:hover{background:#30303a;color:var(--ink)}

  select,input[type=text],input[type=time]{font:inherit;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#26262c;color:var(--ink);width:100%}
  label.fld{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 5px}
  button{font:inherit;cursor:pointer;border-radius:8px;padding:9px 14px;border:1px solid var(--border);background:#26262c;color:var(--ink);touch-action:manipulation}
  button:hover{background:#30303a}
  button:active{transform:scale(.98)}
  /* tinted instead of solid accent, so the main action stands out without glaring */
  button.primary{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
  button.primary:hover{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent)}
  button.sm{padding:6px 10px;font-size:13px}
  button.danger{color:#ff6b5e}
  button.ghost{background:transparent}

  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .row.nowrap{flex-wrap:nowrap}
  .grow{flex:1 1 auto;min-width:0}
  .hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}

  /* watch picker: same as the Rate Meter */
  .watchpick{margin-top:6px}
  .watchpick .row{gap:8px;align-items:stretch}
  #addForm{flex-wrap:wrap}
  #addForm input{flex:1 1 220px}
  @media(max-width:520px){#addForm input{flex-basis:100%}}
  .icon-btn{flex:none;width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
  a.icon-btn{align-self:stretch;border:1px solid var(--border);border-radius:8px;background:#26262c;text-decoration:none}
  a.icon-btn:hover{background:#30303a;color:var(--accent);border-color:var(--accent)}

  .guide{margin-top:18px;background:#241d1a;border:1px solid #45332a;border-radius:12px;padding:18px 20px;display:none}
  .guide-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .guide-head span{font-weight:700;color:var(--accent);font-size:15px}
  .guide-x{border:none;background:transparent;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px;cursor:pointer}
  .guide-x:hover{background:transparent;color:var(--ink)}
  .guide-intro{margin:0 0 12px;font-size:14px;color:var(--ink)}
  .guide-steps{margin:0;padding:0;list-style:none;counter-reset:gs}
  .guide-steps li{counter-increment:gs;position:relative;padding:0 0 10px 34px;font-size:14px;line-height:1.5;color:var(--ink)}
  .guide-steps li:before{content:counter(gs);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .guide-steps li:last-child{padding-bottom:0}
  .guide-note{margin:14px 0 0;font-size:13px;color:#eda57f;background:#2e221c;border-radius:8px;padding:10px 12px}

  /* LED */
  .led{display:flex;align-items:center;justify-content:center;gap:5px}
  .led .digit{width:clamp(22px,5.4vw,40px)}
  .led .digit svg{width:100%;height:auto;display:block}
  .led .seg{fill:var(--amber-off)}
  .led .seg.on{fill:var(--amber);filter:drop-shadow(0 0 4px var(--amber-glow))}
  .led .colon{display:flex;flex-direction:column;gap:10px;padding:0 3px 6px}
  .led .colon .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 4px var(--amber-glow)}
  .led .sp{width:clamp(8px,2vw,14px)}
  .led.green .seg{fill:var(--green-off)}
  .led.green .seg.on{fill:var(--green);filter:drop-shadow(0 0 4px var(--green-glow))}
  .led.green .colon .dot{background:var(--green);box-shadow:0 0 4px var(--green-glow)}
  .led-text{font-family:"Courier New",monospace;color:var(--amber);font-size:30px;font-weight:700;text-align:center;text-shadow:0 0 5px var(--amber-glow);letter-spacing:1px}

  .block{border-top:1px solid var(--border);margin-top:26px;padding-top:22px}
  .block h2{font-size:13px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:0 0 14px;font-weight:700}
  .block h2 .wname{color:var(--accent);text-transform:none;letter-spacing:0}
  .panel{background:linear-gradient(180deg,var(--panel-1),var(--panel-2));border-radius:16px;padding:18px 16px 20px;box-shadow:inset 0 2px 8px rgba(0,0,0,.6);overflow:hidden}
  .plab{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px;text-align:center}
  .grp{background:#1a1a20;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:14px}
  .grp-h{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700}
  .grp-h .meta{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}
  .btns{display:flex;gap:8px}
  .btns button{flex:1}
  .hnote{color:var(--muted);font-size:13px}
  .saverow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
  .reserve{font-size:14px;color:var(--ink)}
  .reserve b{font-family:"Courier New",monospace;color:var(--amber)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{color:var(--muted);font-size:14px;padding:14px 2px;line-height:1.6}
  .typical{font-size:13.5px;color:var(--muted);margin:0 0 6px}
  .typical b{font-family:"Courier New",monospace;color:var(--ink)}

  /* backup status: same line as on the Rate Meter */
  .bkstatus{display:flex;align-items:baseline;gap:10px;font-size:14px;margin-bottom:8px}
  .bkdot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center;background:#5a5a66}
  .bkdot.ok{background:#3be35b;box-shadow:0 0 6px rgba(59,227,91,.6)}
  .bkdot.due{background:#ffb02e;box-shadow:0 0 6px rgba(255,176,46,.6)}
  .bkstatus .mut,.bkstatus.idle{color:var(--muted)}
  .datalink{font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none}
  .datalink:hover{text-decoration:underline}
  /* reminder after saving when a backup is due (same as the Rate Meter) */
  .bknudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--muted);background:#0e0e12;border:1px solid var(--border)}
  .bknudge .txt{flex:1 1 220px}
  .bknudge .txt b{color:var(--ink);font-weight:600}
  .bknudge .ok{color:#3be35b;font-weight:700;margin-right:4px}
  .bknudge .x{background:none;border:none;color:var(--muted);padding:2px 6px;font-size:16px;line-height:1}
  .bknudge .x:hover{color:var(--ink);background:none}
  .notice{background:#2e221c;border:1px solid #45332a;color:#eda57f;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none}

  .banner{margin-top:26px;background:var(--banner,#b06a4a);color:#fff;font-weight:700;text-align:center;padding:16px;border-radius:8px;font-size:15px}
  .gears{margin-top:14px;text-align:center;font-size:12.5px;color:#8f8c96}
  .gears a{color:var(--accent);text-decoration:none}
  .gears a:hover{text-decoration:underline}

  @media(max-width:600px){.card{padding:22px 16px 26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr">
      <div>
        <h1 id="title">Power Reserve</h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="hdr-right">
        <button class="help-btn" id="helpBtn" aria-label="How it works">?</button>
      </div>
    </div>

    <div class="notice" id="notice"></div>

    <div class="watchpick">
      <label class="fld" id="watchSelLbl" for="watchSel"></label>
      <div class="row nowrap" id="watchRow">
        <select id="watchSel" class="grow"></select>
        <a class="icon-btn" id="watchInfo" href="/collection/">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M8 1.8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 8 1.8zM8 7.2v4M8 4.9v.1"
                  fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
      <div class="row nowrap" id="addForm" style="display:none">
        <input type="text" id="newWatch" class="grow">
        <button class="primary" id="addWatch"></button>
        <button id="addCancel"></button>
      </div>
    </div>

    <div class="guide" id="guide">
      <div class="guide-head">
        <span id="guideTitle"></span>
        <button class="guide-x" id="guideClose" aria-label="Close">&times;</button>
      </div>
      <p class="guide-intro" id="guideIntro"></p>
      <ol class="guide-steps">
        <li id="gStep1"></li>
        <li id="gStep2"></li>
        <li id="gStep3"></li>
        <li id="gStep4"></li>
      </ol>
      <p class="guide-note" id="guideNote"></p>
    </div>

    <div class="block" id="meterBlock">
      <h2 id="meterH2"></h2>
      <div id="meter"></div>
      <div class="bknudge" id="bkNudge" style="display:none"></div>
    </div>

    <div class="block">
      <h2 id="histH2"></h2>
      <div id="histWrap"></div>
    </div>

    <!-- backup & restore live in the Collection; this line only shows the status -->
    <div class="block" id="dataBlock">
      <div class="bkstatus" id="bkStatus"><span class="bkdot" id="bkDot"></span><span id="bkText"></span></div>
      <a class="datalink" id="dataLink" href="/collection/?backup"></a>
    </div>

    <div class="banner" id="banner"></div>
    <div class="gears" id="gears"></div>
  </div>
</div>

  bkToday:"today", bkYesterday:"yesterday", bkDaysAgo:"{n} days ago", bkGo:"Back up now", bkDismiss:"Dismiss",

 },

  guideTitle:"Zo werkt het", guideIntro:"Ontdek hoe lang je horloge loopt op een volledige opwinding.",

  reserve:"Gangreserve:", save:"Opslaan", discard:"Verwerpen", back:"Terug", del:"verwijder",

  histH2:"Historie",
  noHist:"Nog geen gangreserve-metingen opgeslagen voor dit horloge.",
  thDate:"Opgewonden", thReserve:"Gangreserve", typical:"Typisch:", over:"uit {n} metingen", overOne:"uit 1 meting",

  bkNever:"Nog nooit een back-up gemaakt", bkOnlyHereOne:"1 item staat alleen in deze browser", bkOnlyHereMany:"{n} items staan alleen in deze browser",

  bkSince:"<b>{m}</b> sinds je laatste back-up van {ago}.", bkNeverOne:"<b>{m}</b> staat alleen in deze browser.", bkNeverMany:"<b>{m}</b> staan alleen in deze browser.",
  bkToday:"vandaag", bkYesterday:"gisteren", bkDaysAgo:"{n} dagen geleden", bkGo:"Back-up maken", bkDismiss:"Sluiten",

 }
};
var LKEY="siouxWatchRateMeterLang";
var lang=(function(){try{return localStorage.getItem(LKEY)||"en";}catch(e){return "en";}})();
function tr(k,vars){var s=I18N[lang][k];if(vars)for(var p in vars)s=s.replace("{"+p+"}",vars[p]);return s;}

/* ===== seven-segment ===== */
var SEG={a:"12,14 18,8 62,8 68,14 62,20 18,20",b:"66,16 72,22 72,62 66,68 60,62 60,22",
c:"66,72 72,78 72,118 66,124 60,118 60,78",d:"12,126 18,120 62,120 68,126 62,132 18,132",
e:"14,72 20,78 20,118 14,124 8,118 8,78",f:"14,16 20,22 20,62 14,68 8,62 8,22",
g:"12,70 18,64 62,64 68,70 62,76 18,76"};
var ORDER=["a","b","c","d","e","f","g"];
var MAP={"0":"abcdef","1":"bc","2":"abged","3":"abgcd","4":"fgbc","5":"afgcd","6":"afgedc","7":"abc","8":"abcdefg","9":"abcdfg","d":"bcdeg","-":"g"};
function ledInto(el,str,cls){
  el.className="led"+(cls?(" "+cls):"");
  el.innerHTML="";
  var ns="http://www.w3.org/2000/svg";
  for(var i=0;i<str.length;i++){
    var ch=str[i];
    if(ch===":"){var c=document.createElement("div");c.className="colon";c.innerHTML='<span class="dot"></span><span class="dot"></span>';el.appendChild(c);continue;}
    if(ch===" "){var sp=document.createElement("div");sp.className="sp";el.appendChild(sp);continue;}
    var on=MAP[ch]||"";
    var d=document.createElement("div");d.className="digit";
    var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 80 140");
    ORDER.forEach(function(id){var p=document.createElementNS(ns,"polygon");p.setAttribute("points",SEG[id]);p.setAttribute("class","seg"+(on.indexOf(id)>-1?" on":""));svg.appendChild(p);});
    d.appendChild(svg);el.appendChild(d);
  }
}

/* ===== storage (shared with the Rate Meter) ===== */
var KEY="siouxWatchRateMeter";
var memOnly=false, state;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function load(){try{var raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){memOnly=true;}return null;}
function save(){if(memOnly)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){memOnly=true;showNotice();}}
function showNotice(){var n=document.getElementById("notice");n.style.display="block";n.textContent=tr("notice");}
function seed(){return {version:2,activeWatch:null,watches:[]};}
function loadState(){
  state=load()||seed();
  if(!Array.isArray(state.watches))state.watches=[];
  if(state.watches.length&&!state.watches.some(function(w){return w.id===state.activeWatch;}))state.activeWatch=state.watches[0].id;
}
loadState();

/* ===== helpers ===== */
function running(w){return !!(w&&w.prCurrent&&w.prCurrent.start);}
function activeWatch(){return state.watches.find(function(w){return w.id===state.activeWatch;})||state.watches[0]||null;}
function byId(id){return state.watches.find(function(w){return w.id===id;});}
function loc(){return lang==="nl"?"nl-NL":"en-GB";}
function fmtDT(ms){return new Date(ms).toLocaleString(loc(),{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});}
function fmtDay(ms){return new Date(ms).toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"});}
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* elapsed time -> LED string, adaptive */
function elapsedLED(ms){
  if(ms<0)ms=0;
  var days=Math.floor(ms/86400000);
  if(days>=90){ // very long: years/months/days as text, not a LED clock
    var y=Math.floor(days/365), mo=Math.floor((days%365)/30), dd=(days%365)%30;
    var s=""; if(y)s+=y+"y "; if(mo||y)s+=mo+"mo "; s+=dd+"d";
    return {text:s,big:false};
  }
  var s2=Math.floor(ms/1000);
  var d=Math.floor(s2/86400); s2-=d*86400;
  var h=Math.floor(s2/3600); s2-=h*3600;
  var mi=Math.floor(s2/60); s2-=mi*60;
  function p(n){return (n<10?"0":"")+n;}
  return {text:(d>0?d+"d ":"")+p(h)+":"+p(mi)+":"+p(s2),big:true};
}
/* compact reserve: hours under 3 days, then days, then y/mo/d */
function fmtReserve(ms){
  if(ms<0)ms=0;
  var totalMin=Math.round(ms/60000);
  var days=Math.floor(totalMin/1440);
  if(days>=90){var y=Math.floor(days/365),mo=Math.floor((days%365)/30),dd=(days%365)%30;var a=[];if(y)a.push(y+"y");if(mo||y)a.push(mo+"mo");a.push(dd+"d");return a.join(" ");}
  if(totalMin>=72*60){var d=Math.floor(totalMin/1440),h=Math.floor((totalMin%1440)/60),m=totalMin%60;return d+"d "+h+"h "+(m<10?"0":"")+m+"m";}
  var h2=Math.floor(totalMin/60),m2=totalMin%60;return h2+"h "+(m2<10?"0":"")+m2+"m";
}

/* hands HH:MM (watch time) -> real stop moment, with day resolution */
function resolveStop(startMs,lastRunMs,offsetSec,hh,mm,dayIdx){
  var base=new Date(startMs),cands=[];
  for(var d=0;d<500;d++){
    var c=new Date(base.getFullYear(),base.getMonth(),base.getDate()+d,hh,mm,0,0).getTime()-offsetSec*1000;
    if(c>=startMs-60000)cands.push(c);
  }
  if(dayIdx!=null&&cands[dayIdx]!=null)return cands[dayIdx];
  var lb=lastRunMs||startMs;
  for(var i=0;i<cands.length;i++)if(cands[i]>=lb)return cands[i];
  return cands[0]||startMs;
}
function stopCandidates(startMs,offsetSec,hh,mm){
  var base=new Date(startMs),cands=[];
  for(var d=0;d<40;d++){
    var c=new Date(base.getFullYear(),base.getMonth(),base.getDate()+d,hh,mm,0,0).getTime()-offsetSec*1000;
    if(c>=startMs-60000)cands.push(c);
  }
  return cands;
}
function isAutoIdx(pr,cands,i){
  var lb=pr.lastRunning||pr.start;
  for(var j=0;j<cands.length;j++)if(cands[j]>=lb)return j===i;
  return i===0;
}
function parseHHMM(v){var m=(v||"").trim().match(/^(\d{1,2})[:.\s](\d{2})$/);if(!m)return null;var h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return {h:h,m:mi};}
function dayOptions(pr,cands){
  return cands.map(function(c,i){var auto=isAutoIdx(pr,cands,i);
    return '<option value="'+i+'"'+(pr.dayIdx===i||(pr.dayIdx==null&&auto)?' selected':'')+'>'+fmtDay(c)+(auto?' '+tr("auto"):'')+'</option>';}).join("");
}

/* ===== watch picker: same as the Rate Meter; details, renaming and deleting live in the Collection ===== */
var NEW_WATCH="__new__",adding=false,guideOpen=false;
// marker after a watch with a running measurement, same as on the Rate Meter
var LIVE_MARK="\u2002\u25cf";
function renderWatches(){
  var sel=document.getElementById("watchSel");
  var empty=!state.watches.length,naming=adding||empty;
  sel.innerHTML=state.watches.map(function(w){return '<option value="'+escapeHtml(String(w.id))+'">'+escapeHtml(w.name)+(running(w)?LIVE_MARK:"")+'</option>';}).join("")
    +'<option disabled>──────────</option>'
    +'<option value="'+NEW_WATCH+'">'+escapeHtml(tr("addToggle"))+'</option>';
  if(!empty)sel.value=String(state.activeWatch);
  document.getElementById("watchInfo").href="/collection/"+(empty?"":"#"+encodeURIComponent(state.activeWatch));
  document.getElementById("watchRow").style.display=naming?"none":"";
  document.getElementById("addForm").style.display=naming?"":"none";
  document.getElementById("addCancel").style.display=empty?"none":"";
}
function startAdding(){adding=true;renderWatches();document.getElementById("newWatch").focus();}
function closeAddForm(){adding=false;document.getElementById("newWatch").value="";renderWatches();}
function addWatch(){var inp=document.getElementById("newWatch");var name=inp.value.trim();if(!name){inp.focus();return;}
  var w={id:uid(),name:name,measurements:[]};state.watches.push(w);state.activeWatch=w.id;
  adding=false;inp.value="";save();renderAll();}

/* ===== meter: one step group for the state of the chosen watch =====
   Only the two start steps are numbered; once running, the earlier steps are gone. */
function watchSuffix(w){return ' &mdash; <span class="wname">'+(w?escapeHtml(w.name):tr("chooseWatch"))+'</span>';}
function grp(n,title,meta,body){
  return '<div class="grp"><div class="grp-h">'+(n?'<span class="grp-n">'+n+'</span>':'')+'<span>'+title+'</span>'
    +(meta?'<span class="meta">'+meta+'</span>':'')+'</div>'+body+'</div>';
}
// Note on a measurement: typed before the start (kept per watch until it starts), then
// stored on prCurrent and editable while running and once stopped; saved with the result.
var startNotes={};
function noteField(id,val){
  return '<div style="margin-top:12px"><label class="fld" for="'+id+'">'+tr("note")+'</label>'
    +'<input type="text" id="'+id+'" maxlength="200" placeholder="'+escapeHtml(tr("optional"))+'" value="'+escapeHtml(val||"")+'"></div>';
}
// no rebuild on input, so typing never loses focus
function bindNote(id,pr){document.getElementById(id).oninput=function(e){pr.note=e.target.value;save();};}
function renderMeter(){
  var w=activeWatch(),box=document.getElementById("meter");
  document.getElementById("meterH2").innerHTML=escapeHtml(tr("measuringLabel"))+watchSuffix(w);
  document.getElementById("meterBlock").style.opacity=w?"1":".45";
  var pr=running(w)?w.prCurrent:null;
  if(!pr){
    box.innerHTML=grp(1,tr("grpWind"),"",
        '<div class="panel"><div class="led green" id="greenClock"></div></div>'
        +'<p class="hint">'+tr("greenTxt")+'</p>')
      +grp(2,tr("grpStart"),"",'<div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap">'
        +'<div style="flex:1 1 220px">'+noteField("startNote",w&&startNotes[w.id]).replace('style="margin-top:12px"','')+'</div>'
        +'<button class="primary" id="woundBtn" style="flex:none"'+(w?'':' disabled')+'>'+tr("wound")+'</button></div>');
    document.getElementById("startNote").oninput=function(e){var ww=activeWatch();if(ww)startNotes[ww.id]=e.target.value;};
    document.getElementById("woundBtn").onclick=function(){
      var ww=activeWatch();if(!ww)return;
      ww.prCurrent={start:Date.now(),offset:0,lastRunning:null,stopped:false,handsInput:"",dayIdx:null};
      if((startNotes[ww.id]||"").trim())ww.prCurrent.note=startNotes[ww.id].trim();
      delete startNotes[ww.id];
      hideNudge();save();renderAll();
    };
  }else if(!pr.stopped){
    box.innerHTML=grp(0,tr("grpRunning"),escapeHtml(tr("woundAt",{d:fmtDT(pr.start)})),
        '<div class="panel"><p class="plab">'+tr("elapsed")+'</p><div class="led" id="elapsed"></div></div>'
        +'<div class="btns" style="margin-top:14px"><button id="stillBtn">'+tr("stillRunning")+'</button><button id="stopBtn">'+tr("stopped")+'</button></div>'
        +(pr.lastRunning?'<p class="hint" style="text-align:center">'+tr("lastConfirmed",{d:fmtDT(pr.lastRunning)})+'</p>':'')
        +noteField("runNote",pr.note));
    bindNote("runNote",pr);
    document.getElementById("stillBtn").onclick=function(){pr.lastRunning=Date.now();save();renderMeter();};
    document.getElementById("stopBtn").onclick=function(){pr.stopped=true;save();renderMeter();};
  }else{
    var parsed=parseHHMM(pr.handsInput);
    var cands=parsed?stopCandidates(pr.start,pr.offset,parsed.h,parsed.m):[];
    box.innerHTML=grp(0,tr("grpStopped"),escapeHtml(tr("woundAt",{d:fmtDT(pr.start)})),
        '<div class="row" style="align-items:flex-end">'
        +'<div style="flex:1 1 120px"><label class="fld" for="handsIn">'+tr("handsAt")+'</label><input type="time" id="handsIn" value="'+escapeHtml(pr.handsInput||"")+'"></div>'
        +'<div style="flex:1 1 120px"><label class="fld" for="daySel">'+tr("day")+'</label><select id="daySel"'+(cands.length?'':' disabled')+'>'+dayOptions(pr,cands)+'</select></div>'
        +'</div>'
        +noteField("stopNote",pr.note)
        +'<div class="saverow"><span class="reserve">'+tr("reserve")+' <b id="resVal">—</b></span>'
        +'<div style="display:flex;gap:8px"><button class="sm" id="backBtn">'+tr("back")+'</button>'
        +'<button class="sm" id="discardBtn">'+tr("discard")+'</button>'
        +'<button class="sm primary" id="saveBtn">'+tr("save")+'</button></div></div>');
    refreshStop(w);
    // no rebuild on input: that would close the iOS time picker
    document.getElementById("handsIn").oninput=function(e){pr.handsInput=e.target.value;pr.dayIdx=null;save();refreshStop(w);};
    document.getElementById("daySel").onchange=function(e){pr.dayIdx=+e.target.value;save();refreshStop(w);};
    bindNote("stopNote",pr);
    document.getElementById("backBtn").onclick=function(){pr.stopped=false;save();renderMeter();};
    document.getElementById("discardBtn").onclick=function(){
      if(!confirm(tr("confirmDiscard")))return;
      WatchData.markDeleted(state,"pr:"+pr.start);delete w.prCurrent;save();renderAll();};
    document.getElementById("saveBtn").onclick=function(){
      var p=parseHHMM(pr.handsInput);if(!p){alert(tr("invalidHands"));return;}
      var stopMs=resolveStop(pr.start,pr.lastRunning,pr.offset,p.h,p.m,pr.dayIdx);
      if(!Array.isArray(w.powerReserve))w.powerReserve=[];
      w.powerReserve.push({id:uid(),start:pr.start,stop:stopMs,offset:pr.offset,reserveMs:stopMs-pr.start,note:(pr.note||"").trim()});
      WatchData.markDeleted(state,"pr:"+pr.start);delete w.prCurrent;save();renderAll();showNudge();};
  }
  tickClock();
}
function refreshStop(w){
  var pr=w.prCurrent,daySel=document.getElementById("daySel"),resEl=document.getElementById("resVal"),saveBtn=document.getElementById("saveBtn");
  if(!pr||!daySel)return;
  var parsed=parseHHMM(pr.handsInput);
  if(!parsed){daySel.disabled=true;daySel.innerHTML="";resEl.textContent="—";saveBtn.disabled=true;return;}
  var cands=stopCandidates(pr.start,pr.offset,parsed.h,parsed.m);
  daySel.disabled=false;daySel.innerHTML=dayOptions(pr,cands);
  var stopMs=resolveStop(pr.start,pr.lastRunning,pr.offset,parsed.h,parsed.m,pr.dayIdx);
  resEl.textContent=fmtReserve(stopMs-pr.start);
  saveBtn.disabled=!(stopMs>pr.start);
}

/* green site clock (= watch time) and the running counter */
function tickClock(){
  var gc=document.getElementById("greenClock"),el=document.getElementById("elapsed");
  function p(n){return (n<10?"0":"")+n;}
  if(gc){var d=new Date();ledInto(gc,p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds()),"green");}
  if(el){var w=activeWatch();
    if(running(w)){var r=elapsedLED(Date.now()-w.prCurrent.start);
      if(r.big)ledInto(el,r.text,"");else{el.className="led-text";el.textContent=r.text;}}}
}

/* ===== history of the chosen watch ===== */
function renderHistory(){
  var w=activeWatch(),wrap=document.getElementById("histWrap");
  document.getElementById("histH2").innerHTML=escapeHtml(tr("histH2"))+watchSuffix(w);
  var list=(w&&Array.isArray(w.powerReserve)?w.powerReserve:[]).slice().sort(function(a,b){return b.start-a.start;});
  if(!list.length){wrap.innerHTML='<div class="empty">'+tr("noHist")+'</div>';return;}
  var avg=list.reduce(function(a,m){return a+m.reserveMs;},0)/list.length;
  var html='<p class="typical">'+tr("typical")+' <b>~'+fmtReserve(avg)+'</b> '+(list.length===1?tr("overOne"):tr("over",{n:list.length}))+'</p>'
    +'<table><thead><tr><th>'+tr("thDate")+'</th><th>'+tr("thReserve")+'</th><th>'+tr("thNote")+'</th><th></th></tr></thead><tbody>';
  list.forEach(function(m){
    html+='<tr><td class="num">'+fmtDay(m.start)+'</td><td class="num">'+fmtReserve(m.reserveMs)+'</td><td class="hnote">'+escapeHtml(m.note||"")+'</td>'
      +'<td style="text-align:right"><button class="sm danger ghost" data-delh="'+escapeHtml(m.id)+'">'+tr("del")+'</button></td></tr>';
  });
  wrap.innerHTML=html+'</tbody></table>';
  wrap.querySelectorAll("[data-delh]").forEach(function(b){b.onclick=function(){
    if(!confirm(tr("confirmDelHist")))return;
    var id=b.getAttribute("data-delh");
    WatchData.markDeleted(state,id);w.powerReserve=w.powerReserve.filter(function(x){return x.id!==id;});save();renderAll();};});
}

function renderGuide(){
  var empty=!state.watches.length;
  document.getElementById("guide").style.display=(empty||guideOpen)?"block":"none";
  document.getElementById("guideClose").style.display=empty?"none":"inline-block";
}

/* ===== backup status line and reminder (same as the Rate Meter) ===== */
function backupAgo(ms){
  var a=WatchData.backupAge(ms);
  return a.days===0?tr("bkToday")+", "+a.hm:a.days===1?tr("bkYesterday")+", "+a.hm:tr("bkDaysAgo",{n:a.days});
}
function renderBackup(){
  var st=WatchData.backupStatus(state),html;
  document.getElementById("bkDot").className="bkdot "+st.level;
  document.getElementById("bkStatus").classList.toggle("idle",st.level==="idle");
  if(st.level==="idle")html=escapeHtml(tr("bkIdle"));
  else if(!st.last)html=tr("bkNever")+' <span class="mut">· '+(st.count===1?tr("bkOnlyHereOne"):tr("bkOnlyHereMany",{n:st.count}))+'</span>';
  else if(!st.count)html=tr("bkDone")+" "+backupAgo(st.last.at)+(st.last.file?' <span class="mut">· '+escapeHtml(st.last.file)+'</span>':"");
  else html=tr("bkLast")+" "+backupAgo(st.last.at)+' <span class="mut">· '+(st.count===1?tr("bkNewSinceOne"):tr("bkNewSinceMany",{n:st.count}))+'</span>';
  document.getElementById("bkText").innerHTML=html;
}
function hideNudge(){var n=document.getElementById("bkNudge");n.style.display="none";n.innerHTML="";}
function showNudge(){
  var st=WatchData.backupStatus(state),n=document.getElementById("bkNudge");
  if(st.level!=="due"){hideNudge();return;}
  var m=st.count===1?tr("bkOne"):tr("bkMany",{n:st.count}),msg;
  if(st.last)msg=tr("bkSince",{m:m,ago:backupAgo(st.last.at)});
  else msg=tr(st.count===1?"bkNeverOne":"bkNeverMany",{m:m});
  n.innerHTML='<span class="txt"><span class="ok">✓</span>'+tr("bkSaved")+" "+msg+'</span>'
    +'<button class="primary sm" id="bkNudgeGo">'+tr("bkGo")+'</button>'
    +'<button class="x" id="bkNudgeX" aria-label="'+tr("bkDismiss")+'" title="'+tr("bkDismiss")+'">×</button>';
  n.style.display="";
  document.getElementById("bkNudgeGo").onclick=function(){WatchData.downloadBackup(state);hideNudge();renderBackup();};
  document.getElementById("bkNudgeX").onclick=hideNudge;
}

function renderAll(){applyStatic();renderWatches();renderMeter();renderHistory();renderGuide();renderBackup();}

function setTxt(id,txt){var el=document.getElementById(id);if(el)el.textContent=txt;}
function applyStatic(){
  setTxt("title",tr("title"));
  setTxt("sub",tr("sub"));
  setTxt("watchSelLbl",tr("watchSelLbl"));
  var wi=document.getElementById("watchInfo");wi.setAttribute("aria-label",tr("watchInfo"));wi.title=tr("watchInfo");
  document.getElementById("newWatch").placeholder=tr("watchPlaceholder");
  setTxt("addWatch",tr("add"));
  setTxt("addCancel",tr("addCancel"));
  setTxt("guideTitle",tr("guideTitle"));
  setTxt("guideIntro",tr("guideIntro"));
  ["gStep1","gStep2","gStep3","gStep4"].forEach(function(k){document.getElementById(k).innerHTML=tr(k);});
  setTxt("guideNote",tr("guideNote"));
  document.getElementById("helpBtn").setAttribute("aria-label",tr("guideTitle"));
  setTxt("dataLink",tr("dataLink"));
  setTxt("banner",tr("banner"));
  document.getElementById("gears").innerHTML=tr("gears")+'<a href="/privacy/">'+tr("gearsLink")+'</a>';
  if(memOnly)showNotice();
  document.documentElement.lang=lang;
}

/* ===== events ===== */
document.getElementById("watchSel").onchange=function(e){
  if(e.target.value===NEW_WATCH){startAdding();return;}
  var w=byId(e.target.value);if(!w)return;
  state.activeWatch=w.id;hideNudge();save();renderAll();
};
document.getElementById("addWatch").onclick=addWatch;
document.getElementById("newWatch").addEventListener("keydown",function(e){
  if(e.key==="Enter")addWatch();
  else if(e.key==="Escape"&&state.watches.length)closeAddForm();});
document.getElementById("addCancel").onclick=closeAddForm;
document.getElementById("helpBtn").onclick=function(){guideOpen=!guideOpen;renderGuide();if(guideOpen)document.getElementById("guide").scrollIntoView({behavior:"smooth",block:"nearest"});};
document.getElementById("guideClose").onclick=function(){guideOpen=false;renderGuide();};
window.addEventListener("swclang",function(e){lang=e.detail;hideNudge();renderAll();});
// back/forward restores the page from the browser cache with the data as it was
// then; read it again, or the next save would overwrite changes made elsewhere
window.addEventListener("pageshow",function(e){
  if(!e.persisted)return;
  loadState();renderAll();
});

/* ===== init ===== */
renderAll();
setInterval(tickClock,1000);
</script>
